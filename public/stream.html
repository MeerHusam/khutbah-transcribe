<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KhutbahLive — Streaming</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Amiri:ital@0;1&family=Lora:ital@0;1&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a1410; --panel: #112519; --text: #e8e6df; --dim: #9aa89f;
    --gold: #c9a227; --teal: #4db6ac; --red: #e05252;
    --border: rgba(201,162,39,.25);
  }
  * { box-sizing: border-box; margin: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'Lora', Georgia, serif; min-height: 100vh; }
  header {
    position: sticky; top: 0; z-index: 10; background: rgba(10,20,16,.94); backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--border); padding: 12px 16px;
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  }
  h1 { font-size: 17px; font-weight: 600; }
  h1 .accent { color: var(--gold); }
  .tag { font-size: 10px; letter-spacing: 1px; background: rgba(77,182,172,.15); color: var(--teal);
         border: 1px solid rgba(77,182,172,.4); padding: 3px 8px; border-radius: 20px; }
  .spacer { flex: 1; }
  button { font-family: inherit; font-size: 14px; padding: 9px 18px; border-radius: 8px; cursor: pointer;
           border: 1px solid var(--border); background: var(--panel); color: var(--text); }
  button.primary { background: var(--gold); border-color: var(--gold); color: #1a1508; font-weight: 700; }
  button.recording { background: var(--red); border-color: var(--red); color: #fff; }
  button:disabled { opacity: .45; cursor: default; }
  #err { color: var(--red); font-size: 13px; width: 100%; }

  /* Recording bar */
  #recbar { position: sticky; top: 57px; z-index: 9;
    background: linear-gradient(90deg, rgba(224,82,82,.16), rgba(224,82,82,.05));
    border-bottom: 1px solid rgba(224,82,82,.45); padding: 12px 16px;
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
  #recbar[hidden] { display: none; }
  .rec-live { display: flex; align-items: center; gap: 9px; font-weight: 700; letter-spacing: 1.2px;
              font-size: 14px; color: #ff7b7b; }
  .rec-blob { width: 13px; height: 13px; border-radius: 50%; background: var(--red); animation: recpulse 1.5s infinite; }
  @keyframes recpulse {
    0% { box-shadow: 0 0 0 0 rgba(224,82,82,.75); transform: scale(1); }
    70% { box-shadow: 0 0 0 13px rgba(224,82,82,0); transform: scale(1.12); }
    100% { box-shadow: 0 0 0 0 rgba(224,82,82,0); transform: scale(1); }
  }
  #timer { font-variant-numeric: tabular-nums; font-size: 16px; font-weight: 600; color: #fff; }
  .meter { display: flex; align-items: center; gap: 8px; }
  .meter .lbl { font-size: 11px; color: var(--dim); letter-spacing: .5px; }
  .bars { display: flex; gap: 3px; align-items: flex-end; height: 24px; }
  .bars i { width: 4px; height: 5px; border-radius: 2px; background: #2f4a3a; transition: height .07s linear, background .07s; }
  .bars i.on { background: var(--gold); }
  .bars i.hot { background: var(--red); }
  .quiet-warn { font-size: 12px; color: #e0a552; }
  .rec-stat { font-size: 12px; color: var(--dim); }
  .rec-stat b { color: var(--gold); }

  main { max-width: 780px; margin: 0 auto; padding: 20px 16px 150px; }
  .hint { color: var(--dim); font-size: 14px; text-align: center; margin-top: 50px; line-height: 1.8; }
  .hint code { background: var(--panel); padding: 2px 7px; border-radius: 4px; color: var(--gold); font-size: 13px; }
  .setup { border: 1px solid rgba(224,82,82,.4); background: rgba(224,82,82,.07); border-radius: 10px;
           padding: 18px 20px; margin: 40px auto; max-width: 560px; line-height: 1.75; font-size: 14px; }
  .setup h3 { color: #ff9b9b; font-size: 15px; margin-bottom: 10px; }
  .setup ol { margin: 10px 0 0 18px; }
  .setup a { color: var(--gold); }

  .block { margin: 18px 0; }
  .arabic { direction: rtl; font-family: 'Amiri', serif; font-size: 24px; line-height: 2; text-align: right; }
  .english { margin-top: 8px; font-size: 16px; line-height: 1.65; color: #cfd8d0; }
  .english.pending { color: var(--dim); font-style: italic; }

  .card { border-radius: 12px; padding: 16px 18px; margin: 18px 0; background: var(--panel); }
  .card.quran { border: 1px solid var(--gold); background: linear-gradient(160deg, #142a1c, #112519); }
  .card.hadith { border: 1px solid var(--teal); background: linear-gradient(160deg, #10261f, #0e1f15); }
  .badge { display: flex; align-items: center; gap: 8px; font-size: 13px; margin-bottom: 10px; flex-wrap: wrap; }
  .card.quran .badge { color: var(--gold); }
  .card.hadith .badge { color: var(--teal); }
  .badge a { color: inherit; }
  .badge .note { color: var(--dim); font-size: 12px; }
  .card .arabic { font-size: 26px; }

  /* Live interim text — the "wobble" line that revises itself */
  #livebar { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(10,20,16,.97);
             border-top: 1px solid var(--border); padding: 10px 16px; min-height: 44px; }
  #livebar[hidden] { display: none; }
  #partialAr { direction: rtl; font-family: 'Amiri', serif; font-size: 18px; color: #b9c9be;
               white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #partialEn { font-size: 13px; color: var(--dim); font-style: italic; margin-top: 3px;
               white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
</style>
</head>
<body>
<header>
  <h1><span class="accent">Khutbah</span>Live</h1>
  <span class="tag">STREAMING · SPEECHMATICS</span>
  <div class="spacer"></div>
  <button class="primary" id="btnStart">🎙 Start Listening</button>
  <button id="btnStop" disabled>Stop</button>
  <div id="err"></div>
</header>

<div id="recbar" hidden>
  <div class="rec-live"><span class="rec-blob"></span> RECORDING</div>
  <div id="timer">0:00</div>
  <div class="meter">
    <span class="lbl">MIC</span>
    <div class="bars" id="bars"></div>
    <span class="quiet-warn" id="quietWarn" hidden>no sound detected — check mic</span>
  </div>
  <div class="spacer"></div>
  <div class="rec-stat"><b id="wordCount">0</b> words · <span id="phase">connecting…</span></div>
</div>

<main><div id="feed"></div></main>

<div id="livebar" hidden>
  <div id="partialAr"></div>
  <div id="partialEn"></div>
</div>

<script>
const feed = document.getElementById('feed');
const btnStart = document.getElementById('btnStart');
const btnStop = document.getElementById('btnStop');
const errBox = document.getElementById('err');
const recbar = document.getElementById('recbar');
const timerEl = document.getElementById('timer');
const barsEl = document.getElementById('bars');
const quietWarn = document.getElementById('quietWarn');
const wordCountEl = document.getElementById('wordCount');
const phaseEl = document.getElementById('phase');
const livebar = document.getElementById('livebar');
const partialAr = document.getElementById('partialAr');
const partialEn = document.getElementById('partialEn');

const BAR_COUNT = 14;
for (let i = 0; i < BAR_COUNT; i++) barsEl.appendChild(document.createElement('i'));
const barEls = [...barsEl.children];

let ws = null, stream = null, audioCtx = null, node = null;
let running = false, hosting = false, startedMs = 0, timerInt = null;
let peak = 0, loudFrames = 0, meterRAF = null, wordTotal = 0;
const events = new Map();
const blocks = new Map();

const HINT = `<div class="hint">Press <b>Start Listening</b> and speak, or play a khutbah recording near the mic.<br>
  Words appear as they're recognised (~1s) and correct themselves as more audio arrives.<br>
  Quran ayahs get gold cards; hadiths get teal cards with sunnah.com references.</div>`;
feed.innerHTML = HINT;

function esc(s) { const d = document.createElement('div'); d.textContent = s ?? ''; return d.innerHTML; }
function fmt(ms) { const s = Math.floor(ms/1000); return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`; }
function nearBottom() { return window.innerHeight + window.scrollY >= document.body.scrollHeight - 200; }

function render(ev) {
  let el = blocks.get(ev.id);
  const fresh = !el;
  if (fresh) { el = document.createElement('div'); blocks.set(ev.id, el); }

  if (ev.type === 'prose') {
    el.className = 'block';
    const eng = ev.english
      ? `<div class="english">${esc(ev.english)}</div>`
      : ev.pending ? '<div class="english pending">translating…</div>' : '';
    el.innerHTML = `<div class="arabic">${esc(ev.arabic)}</div>${eng}`;
  } else if (ev.type === 'quran') {
    el.className = 'card quran';
    el.innerHTML = `<div class="badge">📖 <b>Quran · ${esc(ev.surah_name)} ${ev.surah_number}:${ev.ayah_number}</b>
        <a href="${esc(ev.link)}" target="_blank" rel="noopener">quran.com ↗</a></div>
      <div class="arabic">${esc(ev.arabic)}</div><div class="english">${esc(ev.english)}</div>`;
  } else if (ev.type === 'hadith') {
    el.className = 'card hadith';
    const bits = [];
    if (ev.narrator) bits.push('Narrated ' + esc(ev.narrator));
    if (ev.collection) bits.push(esc(ev.collection) + (ev.hadith_number ? ' ' + esc(ev.hadith_number) : ''));
    const link = ev.link ? ` <a href="${esc(ev.link)}" target="_blank" rel="noopener">sunnah.com ↗</a>` : '';
    el.innerHTML = `<div class="badge">📜 <b>Hadith</b> · ${bits.join(' · ') || 'reference pending'}${link}
        <span class="note">${esc(ev.note || '')}</span></div>
      <div class="arabic">${esc(ev.arabic)}</div>`;
  }
  if (fresh) { const near = nearBottom(); feed.appendChild(el); if (near) window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' }); }
}

function upsert(ev) {
  const cur = events.get(ev.id) || {};
  Object.assign(cur, ev);
  events.set(cur.id, cur);
  render(cur);
}

function onMessage(raw) {
  let m; try { m = JSON.parse(raw); } catch { return; }
  if (m.type === 'snapshot') {
    if (m.events?.length) { feed.innerHTML = ''; blocks.clear(); events.clear(); m.events.forEach(upsert); }
  } else if (m.type === 'event') {
    if (feed.querySelector('.hint')) feed.innerHTML = '';
    upsert(m.event);
    if (m.event.type === 'prose') { wordTotal += m.event.arabic.split(/\s+/).length; wordCountEl.textContent = wordTotal; }
  } else if (m.type === 'update') {
    if (events.has(m.id)) upsert(Object.assign({ id: m.id }, m.patch));
  } else if (m.type === 'partial') {
    livebar.hidden = !hosting && !m.text;
    partialAr.textContent = m.text || '';
    if (m.text && hosting) phaseEl.textContent = 'listening…';
  } else if (m.type === 'partial_en') {
    partialEn.textContent = m.text || '';
  } else if (m.type === 'status') {
    if (m.status === 'live' && hosting) phaseEl.textContent = 'listening…';
    if (m.status === 'ended' && !hosting) resetControls();
  } else if (m.type === 'error') {
    errBox.textContent = m.message;
    if (m.fatal) { showSetupHelp(m.message); stopAll(); }
    else setTimeout(() => errBox.textContent = '', 8000);
  }
}

function showSetupHelp(msg) {
  if (!/SPEECHMATICS_API_KEY/.test(msg)) return;
  feed.innerHTML = `<div class="setup"><h3>Speechmatics API key required</h3>
    This streaming mode needs a Speechmatics key (free tier includes 40 hours/month).
    <ol>
      <li>Sign up at <a href="https://portal.speechmatics.com" target="_blank" rel="noopener">portal.speechmatics.com</a></li>
      <li>Create an API key in the portal</li>
      <li>Add <code>SPEECHMATICS_API_KEY=your_key</code> to <code>.env</code></li>
      <li>Restart the server</li>
    </ol>
    The existing upload pipeline and <code>/live</code> mode work without this key.</div>`;
}

function startMeter(ms) {
  const src = audioCtx.createMediaStreamSource(ms);
  const analyser = audioCtx.createAnalyser();
  analyser.fftSize = 512; analyser.smoothingTimeConstant = .75;
  src.connect(analyser);
  const buf = new Uint8Array(analyser.frequencyBinCount);
  loudFrames = 0;
  const tick = () => {
    if (!running) return;
    analyser.getByteFrequencyData(buf);
    let sum = 0; for (let i = 0; i < buf.length; i++) sum += buf[i];
    const avg = sum / buf.length;
    if (avg > 4) loudFrames++;
    const lit = Math.round(Math.min(1, avg / 55) * BAR_COUNT);
    barEls.forEach((b, i) => {
      b.style.height = (5 + (i < lit ? 4 + i * 1.3 : 0)) + 'px';
      b.className = i < lit ? (i > BAR_COUNT - 4 ? 'hot' : 'on') : '';
    });
    quietWarn.hidden = !(Date.now() - startedMs > 5000 && loudFrames < 5);
    meterRAF = requestAnimationFrame(tick);
  };
  tick();
}

async function start() {
  errBox.textContent = '';
  if (hosting) return;
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      audio: { channelCount: 1, echoCancellation: false, noiseSuppression: false, autoGainControl: true },
    });
  } catch (e) { errBox.textContent = 'Microphone access denied: ' + e.message; return; }

  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  ws = new WebSocket(`${proto}//${location.host}/ws/stream`);
  ws.binaryType = 'arraybuffer';
  ws.onmessage = e => onMessage(e.data);
  ws.onerror = () => { errBox.textContent = 'connection error'; };
  ws.onclose = () => { if (running) { errBox.textContent = 'connection lost'; stopAll(); } };

  ws.onopen = async () => {
    const key = new URLSearchParams(location.search).get('key') || '';
    ws.send(JSON.stringify({ type: 'start', title: 'Live Khutbah (streaming)', key }));

    feed.innerHTML = ''; blocks.clear(); events.clear(); wordTotal = 0;
    running = true; hosting = true; startedMs = Date.now();
    btnStart.disabled = true; btnStart.textContent = '🔴 Recording'; btnStart.classList.add('recording');
    btnStop.disabled = false;
    recbar.hidden = false; livebar.hidden = false;
    wordCountEl.textContent = '0'; phaseEl.textContent = 'connecting…';
    timerInt = setInterval(() => timerEl.textContent = fmt(Date.now() - startedMs), 500);

    // AudioWorklet: continuous raw PCM at 16kHz — no encoding, no chunk boundaries.
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    await audioCtx.audioWorklet.addModule('/pcm-worklet.js');
    const src = audioCtx.createMediaStreamSource(stream);
    node = new AudioWorkletNode(audioCtx, 'pcm-processor', { processorOptions: { targetRate: 16000 } });
    node.port.onmessage = e => {
      if (ws && ws.readyState === 1) ws.send(e.data.pcm);
    };
    src.connect(node);
    // Worklets need a destination to be pulled; a muted gain keeps it running silently.
    const mute = audioCtx.createGain(); mute.gain.value = 0;
    node.connect(mute); mute.connect(audioCtx.destination);
    startMeter(stream);
  };
}

function resetControls() {
  btnStart.disabled = false; btnStart.textContent = '🎙 Start Listening'; btnStart.classList.remove('recording');
  btnStop.disabled = true;
  recbar.hidden = true; livebar.hidden = true;
  partialAr.textContent = ''; partialEn.textContent = '';
  clearInterval(timerInt); timerInt = null; timerEl.textContent = '0:00';
  if (meterRAF) cancelAnimationFrame(meterRAF), meterRAF = null;
  barEls.forEach(b => { b.style.height = '5px'; b.className = ''; });
}

function stopAll() {
  running = false; hosting = false;
  try { node && node.disconnect(); } catch {}
  try { audioCtx && audioCtx.close(); } catch {}
  try { stream && stream.getTracks().forEach(t => t.stop()); } catch {}
  audioCtx = null; node = null;
  resetControls();
}

btnStart.onclick = start;
btnStop.onclick = () => {
  if (ws && ws.readyState === 1) ws.send(JSON.stringify({ type: 'stop' }));
  phaseEl.textContent = 'finishing…';
  stopAll();
};

// Passive listener: connect on load so anyone opening the page joins an in-progress khutbah.
(function listen() {
  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  const sock = new WebSocket(`${proto}//${location.host}/ws/stream`);
  sock.onmessage = e => { if (!hosting) onMessage(e.data); };
})();
</script>
</body>
</html>
