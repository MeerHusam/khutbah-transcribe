  async function enhanceQuranRefs(refs) {
    for (let i = 0; i < refs.length; i++) {
      const q = refs[i];
      const s = q.surah_number, a = q.ayah_number || q.ayah;
      if (!s || !a) continue;
      try {
        const r = await fetch(`/api/quran/${s}/${a}${result.quran_en ? `?en=${encodeURIComponent(result.quran_en)}` : ''}`);
        if (!r.ok) continue;
        const d = await r.json();
        if (!d.text) continue;
        const el = document.querySelector(`.ref-arabic[data-ref="${i}"]`);
        if (el) { el.textContent = `﴿${d.text}﴾`; el.classList.add('ref-arabic-full'); }
        const en = document.querySelector(`.ref-english[data-ref-en="${i}"]`);
        if (en && d.translation) {
          en.innerHTML = `${escHtml(d.translation)} <span class="ref-en-source">${escHtml(d.source || 'Sahih International')}</span>`;
          en.hidden = false;
          let after = en;
          for (const L of TR) {
            const tr = result[L.field], text = tr && tr.verses && tr.verses[`${s}:${a}`];
            if (!text) continue;
            en.classList.add('chunk-en');
            after.insertAdjacentHTML('afterend', `<p class="ref-english chunk-tr tr-${L.code}" lang="${L.code}" dir="${L.dir}">${escHtml(text)} <span class="tr-source">${escHtml(tr.verse_source?.name || '')}</span></p>`);
            after = after.nextElementSibling;
          }
        }
        const pop = document.getElementById(`popup-arabic-${i}`);
        if (pop) pop.textContent = `﴿${d.text}﴾`;
      } catch {}
    }
    const chunkArabics = document.querySelectorAll('.chunk-arabic[data-surah]');
    for (const el of chunkArabics) {
      const s = el.dataset.surah, a = el.dataset.ayah;
      if (!s || !a) continue;
      // A recited passage spans several ayahs; fetch every verse in the range so the card
      // shows what was actually recited instead of only its opening verse.
      const aEnd = Math.max(+a, +(el.dataset.ayahEnd || a));
      const ayahNums = [];
      for (let n = +a; n <= aEnd && ayahNums.length < 25; n++) ayahNums.push(n);
      // The block's text is what the imam actually said — read it before the card replaces
      // it with the full verse.
      const recitedText = el.textContent;
      try {
        const arTexts = [], ownEn = [];
        for (const n of ayahNums) {
          const arRes = await fetch(`/api/quran/${s}/${n}${result.quran_en ? `?en=${encodeURIComponent(result.quran_en)}` : ''}`);
          if (!arRes.ok) break;
          const arData = await arRes.json();
          if (!arData.text) break;
          arTexts.push(arData.text);
          ownEn.push(arData.translation);
        }
        if (!arTexts.length) continue;
        // Close each verse with the mushaf end-of-ayah mark and its number in Arabic-Indic
        // digits, so a recited passage reads as distinct verses rather than one long run.
        const arabicNum = n => String(n).replace(/\d/g, d => '٠١٢٣٤٥٦٧٨٩'[+d]);
        // Mark the recited part only when some verse was recited PARTLY; a verse recited
        // whole needs no marking, and neither does a passage recited in full.
        const spans = recitedSpans(recitedText, arTexts);
        const vLen = arTexts.map(t => t.split(/\s+/).filter(Boolean).length);
        const whole = spans.map((sp, v) => sp && sp[0] <= 1 && sp[1] >= vLen[v] - 2);
        const partial = spans.some(Boolean) && !whole.every(Boolean);
        const fullAr = '﴿' + arTexts
          .map((t, i) => `${partial ? markWords(t, whole[i] ? [0, vLen[i] - 1] : spans[i]) : escHtml(t)} ۝${arabicNum(ayahNums[i])}`)
          .join(' ') + '﴾';
        el.innerHTML = fullAr;
        el.classList.add('chunk-arabic-quran');

        // The recited part alone (verse_excerpts.js): the exact Arabic words, and the matching
        // part of each translation where one was found. The full verse is one tap away.
        const ex = partial && ((result && result.verse_excerpts) || [])
          .find(x => x.arabic === recitedText && x.surah === +s && x.ayah === +a);
        const dots = (i, html) => (!whole[i] && spans[i][0] > 0 ? '… ' : '') + html
          + (!whole[i] && spans[i][1] < vLen[i] - 1 ? ' …' : '');
        const partAr = ex && '﴿' + arTexts.map((t, i) => {
          if (!spans[i]) return null;
          const w = t.split(/\s+/).filter(Boolean);
          return `${whole[i] ? escHtml(t) : dots(i, escHtml(w.slice(spans[i][0], spans[i][1] + 1).join(' ')))} ۝${arabicNum(ayahNums[i])}`;
        }).filter(Boolean).join(' ') + '﴾';
        // A translation's recited part, or null when any recited verse lacks one.
        const partOf = (texts, lang, num) => {
          if (!ex) return null;
          const out = [];
          for (let i = 0; i < ayahNums.length; i++) {
            if (!spans[i]) continue;
            // An excerpt made for other words (the alignment has changed since) is not used.
            const v = ex.verses[ayahNums[i]];
            const t = whole[i] ? texts[i] : v && String(v.span) === String(spans[i]) && v[lang];
            if (!t) return null;
            const body = whole[i] ? escHtml(t) : dots(i, escHtml(t));
            out.push(ayahNums.length > 1 ? `(${num(ayahNums[i])}) ${body}` : body);
          }
          return out.join(' ');
        };
        const both = (part, full) => part ? `<span class="v-part">${part}</span><span class="v-full">${full}</span>` : full;

        // A khutbah made with its own English (result.quran_en, from 7 Oct 2026: Hilali & Khan) gets it
        // from the site; an older one keeps Sahih International from alquran.cloud, as it always had.
        const enTexts = result.quran_en ? ownEn.filter(Boolean) : [];
        if (!result.quran_en) for (const n of ayahNums) {
          const enRes = await fetch(`https://api.alquran.cloud/v1/ayah/${s}:${n}/en.sahih`);
          if (!enRes.ok) break;
          const enData = await enRes.json();
          const t = enData?.data?.text;
          if (!t) break;
          enTexts.push(t);
        }
        if (enTexts.length) {
          const enEl = document.createElement('div');
          enEl.className = 'chunk-quran-translation';
          // Number the English too when several verses are shown, so the reader can line
          // each sentence up with the Arabic verse it renders.
          const enVerse = (t, i) => {
            if (!partial) return escHtml(t);
            if (whole[i]) return `<span class="recited">${escHtml(t)}</span>`;
            if (!spans[i]) return `<span class="not-recited">${escHtml(t)}</span>`;
            const r = recitedSentences(t, spans[i], vLen[i]);
            if (!r) return escHtml(t);
            return r.sents.map((x, k) => `<span class="${k >= r.first && k <= r.last ? 'recited' : 'not-recited'}">${escHtml(x)}</span>`).join(' ');
          };
          const fullEn = ayahNums.length > 1
            ? enTexts.map((t, i) => `(${ayahNums[i]}) ${enVerse(t, i)}`).join(' ')
            : enVerse(enTexts[0], 0);
          const partEn = enTexts.length === ayahNums.length ? partOf(enTexts, 'en', n => n) : null;
          enEl.innerHTML = both(partEn, fullEn);
          if (partEn) el.innerHTML = both(partAr, fullAr);
          el.insertAdjacentElement('afterend', enEl);
          let lastEl = enEl;
          // The verse in each other language, from its published translation (core/langs/).
          for (const L of TR) {
            const tr = result[L.field];
            const trTexts = ayahNums.map(n => tr && tr.verses && tr.verses[`${s}:${n}`]);
            if (!trTexts.every(Boolean)) continue;
            enEl.classList.add('chunk-en');
            const trEl = document.createElement('div');
            trEl.className = `chunk-quran-translation chunk-tr tr-${L.code}`;
            trEl.lang = L.code;
            trEl.dir = L.dir;
            const num = n => localNum(n, L);
            // Bold the recited part, as the English does, by clause.
            const trVerse = (t, i) => {
              if (!partial) return escHtml(t);
              if (whole[i]) return `<span class="recited">${escHtml(t)}</span>`;
              if (!spans[i]) return `<span class="not-recited">${escHtml(t)}</span>`;
              const r = recitedSentences(t, spans[i], vLen[i], L);
              if (!r) return escHtml(t);
              return r.sents.map((x, k) => `<span class="${k >= r.first && k <= r.last ? 'recited' : 'not-recited'}">${escHtml(x)}</span>`).join(' ');
            };
            const fullTr = ayahNums.length > 1
              ? trTexts.map((t, i) => `(${num(ayahNums[i])}) ${trVerse(t, i)}`).join(' ')
              : trVerse(trTexts[0], 0);
            trEl.innerHTML = both(partEn && partOf(trTexts, L.code, num), fullTr)
              + ` <span class="tr-source">${escHtml(tr.verse_source?.name || '')}</span>`;
            lastEl.insertAdjacentElement('afterend', trEl);
            lastEl = trEl;
          }
          if (partEn) {
            const btn = document.createElement('button');
            btn.className = 'verse-toggle';
            btn.innerHTML = `<span class="lbl-part">${uiText('Show full ayah')}</span><span class="lbl-full">${uiText('Show recited part')}</span>`;
            btn.onclick = ev => { ev.stopPropagation(); const i = btn.closest('[data-i]').dataset.i; document.querySelectorAll(`[data-i="${i}"]`).forEach(c => c.classList.toggle('show-full-verse')); };
            lastEl.insertAdjacentElement('afterend', btn);
          }
        }
      } catch {}
    }
    // The verse cards change the text on screen: match words again against what they show.
    wordMaps.clear();
    litKey = null;
    paintWord();
  }

  // ── Recited part of a verse card ──
  // looseAr / recitedSpans live in /recited.js, shared with verse_excerpts.js.

  // Wrap words [first, last] of a verse as recited and the rest as not.
  function markWords(text, span) {
    const words = text.split(/\s+/).filter(Boolean);
    if (!span) return `<span class="not-recited">${escHtml(words.join(' '))}</span>`;
    const [f, l] = span, part = (a, b) => escHtml(words.slice(a, b).join(' '));
    return [f > 0 ? `<span class="not-recited">${part(0, f)}</span>` : '',
      `<span class="recited">${part(f, l + 1)}</span>`,
      l < words.length - 1 ? `<span class="not-recited">${part(l + 1, words.length)}</span>` : '']
      .filter(Boolean).join(' ');
  }

  // English has no word alignment to the Arabic, so map the recited share of the verse onto
  // whole clauses of the translation (Sahih International follows the verse's order).
  // Clauses, not sentences: Al-A'raf 7:31's recited half ("eat and drink, but be not
  // excessive…") starts mid-sentence. Returns the clause range, or null when it would not
  // single out a strict subset.
  // Another language (L, core/langs/) splits by its own clause rule: Urdu translations (Junagarhi)
  // use little punctuation, so an Urdu clause also starts at "اور", and a piece under L.clauseMinWords
  // ("زمین اور آسمان") joins the next.
  const CLAUSE_EN = /(?<=[,;:.!?])\s+/;
  function recitedSentences(enText, span, nWords, L = null) {
    let sents = enText.split(L ? new RegExp(L.clause) : CLAUSE_EN).filter(Boolean);
    if (L && L.clauseMinWords) sents = sents.reduce((out, t) => {
      const prev = out[out.length - 1];
      if (prev && prev.split(/\s+/).length < L.clauseMinWords) out[out.length - 1] = prev + ' ' + t; else out.push(t);
      return out;
    }, []);
    if (sents.length < 2 || !span) return null;
    const lens = sents.map(t => t.split(/\s+/).length), total = lens.reduce((x, y) => x + y, 0);
    const from = span[0] / nWords, to = (span[1] + 1) / nWords;
    let acc = 0; const picked = [];
    sents.forEach((t, i) => {
      const a = acc / total, b = (acc + lens[i]) / total; acc += lens[i];
      const overlap = Math.max(0, Math.min(b, to) - Math.max(a, from));
      if (overlap / (b - a) >= 0.4) picked.push(i); // 0.5 dropped 7:31's "and eat and drink"
    });
    if (!picked.length || picked.length === sents.length) return null;
    return { sents, first: picked[0], last: picked[picked.length - 1] };
  }

  function renderQuranRef(q, i) {
    const verifyClass = {
      'agree': 'verify-agree', 'claude_only': 'verify-claude', 'algo_only': 'verify-algo',
      'disagree': 'verify-disagree', 'claude+algorithm': 'verify-agree'
    }[q.verification] || 'verify-agree';
    const verifyLabel = {
      'agree': '✓ Verified', 'claude_only': '~ Claude only', 'algo_only': '~ Algorithm only',
      'disagree': '⚠ Disputed', 'claude+algorithm': '✓ Verified'
    }[q.verification] || '✓ Verified';

    const surah = q.surah_name || q.surah || '';
    const ayah = q.ayah_number || q.ayah || '';
    const refLabel = ayah ? `${surah} ${q.surah_number || ''}:${ayah}` : surah;
    const link = q.quran_link || q.quran_com_link;

    return `
    <div class="ref-card" onclick="openQuranPopup(${i})">
      <div class="ref-card-header">
        <span class="ref-surah">${escHtml(refLabel)}</span>
        <div class="ref-meta"><span class="verify-badge ${verifyClass}">${verifyLabel}</span></div>
      </div>
      <div class="ref-arabic" data-ref="${i}">${escHtml(q.detected_text || q.arabic || '')}</div>
      <p class="ref-english" data-ref-en="${i}" hidden></p>
      ${link ? `<a class="ref-link" href="${link}" target="_blank" rel="noopener" onclick="event.stopPropagation()">View on Quran.com ↗</a>` : ''}
      <p class="tafsir-hint">Tap to view tafsir →</p>
    </div>`;
  }

  // The hadith's published text in language L (core/translate.js), keyed like its sunnah.com link.
  function hadithIn(h, L) {
    const m = (h.link || '').match(/sunnah\.com\/([a-z]+):(\d+)/);
    const tr = result && result[L.field];
    return m && tr && tr.hadith ? tr.hadith[`${m[1]}:${m[2]}`] || null : null;
  }

  function renderHadithRef(h) {
    const narrator = h.narrator && h.narrator !== 'unknown' ? h.narrator : null;
    const collection = h.collection && h.collection !== 'unknown' ? h.collection : null;
    const link = h.link;
    return `
    <div class="hadith-card">
      <div class="hadith-header">
        <span class="hadith-source">${narrator ? `Narrated by ${escHtml(narrator)}` : 'Hadith Reference'}</span>
        ${collection ? `<span class="collection-badge">${escHtml(collection)}${h.hadith_number ? ' · ' + escHtml(String(h.hadith_number)) : ''}</span>` : ''}
      </div>
      <div class="hadith-arabic">${escHtml(h.detected_text || h.arabic || '')}</div>
      ${h.translation ? `<p class="hadith-english${TR.some(L => hadithIn(h, L)) ? ' chunk-en' : ''}">${escHtml(h.translation.charAt(0).toUpperCase() + h.translation.slice(1))} <span class="ref-en-source">sunnah.com</span></p>` : ''}
      ${TR.map(L => { const t = hadithIn(h, L); return t ? `<p class="hadith-english chunk-tr tr-${L.code}" lang="${L.code}" dir="${L.dir}">${escHtml(t.from_companion || t.text)} <span class="tr-source">${escHtml(t.edition)} ${escHtml(String(t.number))}</span></p>` : ''; }).join('')}
      ${link ? `<a class="ref-link hadith-link" href="${escAttr(link)}" target="_blank" rel="noopener">View on sunnah.com ↗</a>` : ''}
    </div>`;
  }

  // The English half of an inline verse or hadith is the quoted run inside the translation.
  // Mark it so the quotation stands out on both sides, matching the Arabic highlight.
  // `kinds` is the order in which the quotations were found in the block's Arabic
  // ('quran' / 'hadith'); the translation keeps that order, so the Nth quote gets the Nth
  // kind. If the counts disagree, only a block quoting a single kind is marked — a verse is
  // never gilded as a hadith or the reverse. Claude uses double quotes or single quotes; a
  // single quote only closes before a space or punctuation, so "Allah's" is not a boundary.
  // "Reported by Muslim", "Recorded by al-Tirmidhi", "Narrated by Abu Dawud", "Agreed upon".
  const EN_SOURCE_RE = /\b(?:(?:Reported|Recorded|Narrated|Related|Transmitted|Collected)(?: by)(?: (?:the )?Imams?)? (?:(?:al-|Al-|an-|at-|Ibn |Abu |Abi )?[A-Z][A-Za-z'`\u2019-]+(?: (?:ibn |bin |and |al-)?[A-Z][A-Za-z'`\u2019-]+){0,3})|Agreed upon)/g;
  function escWithSources(text) {
    let out = '', last = 0;
    for (const m of text.matchAll(EN_SOURCE_RE)) {
      out += escHtml(text.slice(last, m.index)) + '<span class="src-cite-en">' + escHtml(m[0]) + '</span>';
      last = m.index + m[0].length;
    }
    return out + escHtml(text.slice(last));
  }

  const QUOTE_RE = /["\u201C]([^"\u201C\u201D]+)["\u201D]|(?<![A-Za-z])['\u2018](.+?)['\u2019](?=[\s.,;:!?)]|$)/g;
  const HOLE = '\uE000';
  // `spans` are the exact English of the hadith quoted in this block (hadithSpansIn). Each is
  // marked whole, with its quote marks, even where the translation has none around it (11 Sep:
  // "Anas said: The Prophet \u2026 used to perform Wudu\u2026") or breaks it with narration ("Sa'd
  // said:", "He replied:" inside the Sa'd hadith). Quote marks mark the rest, as before.
  function markQuotes(text, kinds, spans = []) {
    const regions = [];
    for (const s of spans) {
      let a = text.indexOf(s);
      if (a < 0) continue;
      let b = a + s.length;
      if (/["\u201C'\u2018]/.test(text[a - 1] ?? '')) a--;
      if (/["\u201D'\u2019]/.test(text[b] ?? '')) b++;
      if (!regions.some(([x, y]) => a < y && b > x)) regions.push([a, b]);
    }
    if (!regions.length) return markQuoted(text, kinds);
    regions.sort((x, y) => x[0] - y[0]);
    const rest = kinds.slice();
    for (const _ of regions) { const i = rest.indexOf('hadith'); if (i >= 0) rest.splice(i, 1); }
    let holed = '', last = 0;
    for (const [a, b] of regions) { holed += text.slice(last, a) + HOLE; last = b; }
    let n = 0;
    return markQuoted(holed + text.slice(last), rest).replace(new RegExp(HOLE, 'g'), () => {
      const [a, b] = regions[n++];
      // Inside the quote, straight double quotes alternate close/open around the narration.
      let open = false;
      const inner = text.slice(a, b).replace(/^["\u201C'\u2018]|["\u201D'\u2019]$/g, '')
        .replace(/"/g, () => ((open = !open) ? '\u201D' : '\u201C'));
      return '<span class="inline-hadith-en">\u201C' + escHtml(inner) + '\u201D</span>';
    });
  }
  function markQuoted(text, kinds) {
    const quotes = [...text.matchAll(QUOTE_RE)].filter(m => !m[0].includes(HOLE));
    if (!quotes.length || !kinds.length) return escWithSources(text);
    const single = new Set(kinds).size === 1 ? kinds[0] : null;
    if (quotes.length !== kinds.length && !single) return escWithSources(text);
    let out = '', last = 0;
    quotes.forEach((m, i) => {
      const kind = quotes.length === kinds.length ? kinds[i] : single;
      const cls = kind === 'hadith' ? 'inline-hadith-en' : 'inline-ayah-en';
      out += escWithSources(text.slice(last, m.index));
      out += `<span class="${cls}">\u201C` + escHtml(m[1] ?? m[2]) + '\u201D</span>';
      last = m.index + m[0].length;
    });
    return out + escWithSources(text.slice(last));
  }

  // Translation language for the reader blocks (English, or a language the khutbah has).
  function setLang(lang, remember = true) {
    for (const L of TR) document.body.classList.toggle(`lang-${L.code}`, lang === L.code);
    document.body.classList.toggle('tr', lang !== 'en');
    if (remember) { try { localStorage.setItem('kt-lang', lang); } catch {} }
    pageLang = lang;
    document.body.classList.toggle('rtl', TR.some(L => L.code === lang && L.dir === 'rtl'));
    markTongues();
    paintWord();
  }

  function markTongues() {
    const ar = document.body.classList.contains('ar-only');
    for (const b of document.querySelectorAll('#tongues button')) b.setAttribute('aria-pressed', String(ar ? b.dataset.l === 'ar' : b.dataset.l === pageLang));
  }
  // One tap reads and hears a language: its translation on screen and its voice (the imam where it has none);
  // العربية is the imam's words alone, in his voice.
  function chooseLang(l) {
    stopHand();
    const ar = l === 'ar';
    document.body.classList.toggle('ar-only', ar);
    if (!ar) setLang(l); else markTongues();
    if (audio) {
      const want = ar ? 'imam' : result['tts_' + l] ? l : 'imam';
      if (want !== voice) switchTrack(want); else updateVoiceBtn();
    }
    wordMaps.clear(); litKey = null; paintWord();
  }

  // Marks a quote whose English above is a direct translation of the imam's words rather than
  // the published one (Meer, 1 Oct: "direct translation" reads better than "our translation").
  function oursLabel(source) {
    const tip = `A direct translation of the imam's words: the ${source} translation differs from what he said, or no part of it could be matched to his words exactly.`;
    return `<span class="trans-ours" title="${escAttr(tip)}">direct translation</span>`;
  }

  const hadithKeyOf = h => { const m = (h.link || '').match(/sunnah\.com\/([a-z]+):(\d+)/); return m ? `${m[1]}:${m[2]}` : null; };

  // The English of each hadith badged in this block, exactly as it appears in the translation:
  // the published excerpt swapped in, or the part of our own translation that renders the
  // hadith (both planned and checked by quote_swaps.js).
  function hadithSpansIn(english) {
    const used = new Set(), spans = [];
    for (const part of english.split(/\n\n+/)) {
      const h = hadithRefForBadge(part.trim(), used);
      if (!h) continue;
      used.add(h);
      const sw = h.english_swap;
      const span = sw && (sw.status === 'published' ? sw.published : sw.ours);
      if (span) spans.push(span);
    }
    return spans;
  }

  // With L (a language of core/langs/) the badges are in that language (the block's L section).
  function renderEnglishParts(english, kinds = [], L = null) {
    const ur = L && result && result[L.field];
    const spans = L ? [] : hadithSpansIn(english);
    return english.split(/\n\n+/).map(part => {
      part = part.trim();
      if (!part) return '';
      // 📑 cites a verse quoted inside this block's prose. Unlike 📖 the block is NOT the
      // recitation, so its Arabic is left exactly as the imam said it.
      const quranMatch = part.match(/^(?:📖|📑)\s+(.+?)\s+—\s+(https:\/\/quran\.com\/([\d]+)\/([\d]+))/);
      const hadithMatch = part.match(/^📚\s+Hadith\s+[·•]\s*(.+)/);
      const hadithTransMatch = part.match(/^❝\s*([\s\S]+)/);
      if (quranMatch) {
        const [, label, url, s, a] = quranMatch;
        const q = part.startsWith('📑')
          && (quranRefs || []).find(r => +r.surah_number === +s && +r.ayah_number === +a && r.english_swap);
        const ref = label.slice(label.lastIndexOf(' ') + 1);
        const shown = ur && ur.surahs && ur.surahs[s] ? `${ur.surahs[s]} ${L.localBadgeDigits ? localNum(ref, L) : ref}` : label;
        return `<a class="chunk-quran-cite" href="${escAttr(url)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">۞ <strong>${escHtml(shown)}</strong> ↗</a>`
          + (!ur && q && q.english_swap.status === 'ours' ? oursLabel(result.quran_en_name || 'Sahih International') : '');
      } else if (hadithTransMatch) {
        return `<div class="chunk-hadith-trans">${escHtml(hadithTransMatch[1])}</div>`;
      } else if (hadithMatch) {
        // Link the badge to the hadith on sunnah.com, as the verse badge links to quran.com.
        const h = hadithRefForBadge(part.trim());
        const nUr = ur && h && ur.narrators && ur.narrators[hadithKeyOf(h)];
        // The imam said "متفق عليه": the card names both Sahihs (its link goes to one of them).
        const both = h && h.in_both_sahihs;
        const cUr = ur && h && (both ? L.bothSahihs : L.collections[h.collection]);
        const text = ur && h && (nUr || cUr)
          ? [nUr, cUr || h.collection].filter(Boolean).join('  ·  ')
          : both ? hadithMatch[1].replace(/Collection:.*$/, 'Collection: Sahih al-Bukhari & Sahih Muslim') : hadithMatch[1];
        return (h && h.link
          ? `<a class="chunk-hadith-cite" href="${escAttr(h.link)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">${escHtml(text)} ↗</a>`
          : `<div class="chunk-hadith-cite">${escHtml(text)}</div>`)
          + (h && h.english_swap && h.english_swap.status === 'ours' ? oursLabel('sunnah.com') : '');
      }
      return `<div class="chunk-english">${markQuotes(part, kinds, spans)}</div>`;
    }).join('');
  }

  // ── Inline ayah marking ──
  // A 📑 badge means the verse was quoted *inside* the imam's own sentence, so the block's
  // Arabic must stay exactly as he said it (unlike 📖, where the whole block is replaced by
  // canonical text). Without this the verse reads as ordinary prose. Locate the ref's
  // detected words inside the block and wrap just those words in ornate brackets + the
  // end-of-ayah mark, leaving the surrounding speech untouched.
  const arabicDigits = n => String(n).replace(/\d/g, d => '٠١٢٣٤٥٦٧٨٩'[+d]);

  // Every 📑 badge in this block, resolved to the words to highlight.
  function inlineAyahRefs(english) {
    const out = [];
    for (const part of english.split(/\n\n+/)) {
      const m = part.trim().match(/^📑\s+.+?\s+(\d+):(\d+)(?:\s*-\s*(\d+))?\s+—\s+https:\/\/quran\.com\/(\d+)\/(\d+)/);
      if (!m) continue;
      const surah = +m[4], ayah = +m[5], endAyah = m[3] ? +m[3] : ayah;
      for (const q of (quranRefs || [])) {
        if (+q.surah_number !== surah || +q.ayah_number !== ayah) continue;
        const words = String(q.detected_text || '').split(/\s+/).map(normArWord).filter(Boolean);
        if (words.length) out.push({ words, endAyah });
      }
    }
    return out;
  }

  // Every 📚 badge in this block, resolved to its hadith's words. The badge line carries the
  // narrator and collection, which identify the ref; each ref is used at most once.
  // The hadith ref a 📚 badge line names ("📚 Hadith · Narrator: X · Collection: Y").
  function hadithRefForBadge(line, used = new Set()) {
    const m = line.match(/^📚\s+Hadith\s+[·•]\s*Narrator:\s*(.*?)\s+[·•]\s+Collection:\s*(.*)$/);
    if (!m) return null;
    return hadithRefList.find(r => !used.has(r) &&
      String(r.narrator ?? 'unknown').trim() === m[1].trim() &&
      String(r.collection ?? 'unknown').trim() === m[2].trim()) || null;
  }

  function inlineHadithRefs(english) {
    const out = [], used = new Set();
    for (const part of english.split(/\n\n+/)) {
      const h = hadithRefForBadge(part.trim(), used);
      if (!h) continue;
      used.add(h);
      const words = String(h.detected_text || '').split(/\s+/).map(normArWord).filter(Boolean);
      if (words.length >= 3) out.push({ words, kind: 'hadith' });
    }
    return out;
  }

  // Find a ref's words in the block. A verse must match exactly. A hadith is located by its
  // opening and closing words, because the imam may restart a word mid-quote
  // ("عينان لا تمس لا تمسهما النار") which the detected text cleans up.
  function locateSpan(norms, w, kind) {
    const find = (run, from) => {
      for (let s = from; s + run.length <= norms.length; s++) {
        if (run.every((x, k) => norms[s + k] === x)) return s;
      }
      return -1;
    };
    if (kind !== 'hadith') {
      const s = find(w, 0);
      return s < 0 ? null : [s, s + w.length - 1];
    }
    let s = -1;
    for (let k = 0; k <= 4 && s < 0 && k + 3 <= w.length; k++) {
      const p = find(w.slice(k, k + 3), 0);
      if (p < 0) continue;
      s = p;
      for (let j = p; j >= Math.max(0, p - k - 3); j--) if (norms[j] === w[0]) { s = j; break; }
    }
    if (s < 0) return null;
    // The hadith ends at the LAST place its closing words stand within reach: they can come twice in
    // it ("…سراء شكر فكان خيراً له، وإن أصابته ضراء صبر فكان خيراً له", Muslim 2999, 9 Oct 2026, was
    // marked only to the first). The khateeb may also say them in another order than the detected
    // text has them ("…يحسن الظن، إلا وهو يحسن بالله الظن" for "…يحسن الظن بالله"): the same three words.
    const tail = w.slice(-3);
    const reach = p => p + 3 <= norms.length && p + 2 - s <= w.length + 6;
    const same = run => [...run].sort().join(' ') === [...tail].sort().join(' ');
    let t = -1;
    for (let p = s; reach(p); p++) if (tail.every((x, k) => norms[p + k] === x)) t = p;
    for (let p = s; t < 0 && reach(p); p++) if (same(norms.slice(p, p + 3))) t = p;
    if (t < 0) return null;
    return [s, t + 2];
  }

  // Returns the marked-up Arabic and the kinds of quotation it marked, in reading order,
  // so the English can mark its quotes the same way.
  // The imam's attribution after a hadith: رواه / أخرجه + collection, or متفق عليه.
  // Names are matched normalised, one or two words.
  const AR_SOURCE_NAMES = ['البخاري', 'مسلم', 'الترمذي', 'ابو داود', 'النسائي', 'ابن ماجه', 'ابن ماجة',
    'احمد', 'الامام احمد', 'مالك', 'الامام مالك', 'البيهقي', 'الطبراني', 'الحاكم', 'الدارمي', 'ابن حبان',
    'الشيخان', 'الامام البخاري', 'الامام مسلم'].map(n => n.split(' '));
  function sourceSpans(norms) {
    const spans = [];
    for (let p = 0; p < norms.length; p++) {
      if (norms[p] === 'متفق' && norms[p + 1] === 'عليه') { spans.push([p, p + 1]); p++; continue; }
      if (!['رواه', 'اخرجه', 'خرجه'].includes(norms[p])) continue;
      // An optional "الإمام" before the name ("رواه الإمام ابن ماجه").
      const at = norms[p + 1] === 'الامام' ? p + 2 : p + 1;
      let len = 0;
      for (const n of AR_SOURCE_NAMES) {
        if (n.length > len && n.every((w, k) => norms[at + k] === w)) len = n.length;
      }
      if (len) len += at - p - 1;
      // "رواه البخاري ومسلم" — a second collection joined by و
      if (len && norms[p + 1 + len]?.startsWith('و')) {
        const rest = norms[p + 1 + len].slice(1);
        if (AR_SOURCE_NAMES.some(n => n.length === 1 && n[0] === rest)) len++;
      }
      if (len) { spans.push([p, p + len]); p += len; }
    }
    return spans;
  }

  function renderChunkArabic(arabic, refs) {
    const toks = arabic.split(/(\s+)/);
    const wordPos = [];
    toks.forEach((t, i) => { if (t.trim()) wordPos.push(i); });
    const norms = wordPos.map(i => normArWord(toks[i]));
    const opens = {}, closes = {};
    for (const ref of refs) {
      const span = locateSpan(norms, ref.words, ref.kind);
      if (!span) continue;
      const [s, e] = span;
      // Overlapping refs would produce interleaved spans; first match wins.
      let clash = false;
      for (let k = s; k <= e; k++) if (opens[k] || closes[k]) { clash = true; break; }
      if (!clash) { opens[s] = ref; closes[e] = ref; }
    }
    const kinds = Object.keys(opens).map(Number).sort((a, b) => a - b)
      .map(p => opens[p].kind === 'hadith' ? 'hadith' : 'quran');
    const srcOpen = {}, srcClose = {};
    for (const [a, b] of sourceSpans(norms)) {
      let inside = false;
      for (let k = a; k <= b; k++) if (opens[k] || closes[k]) inside = true;
      if (!inside) { srcOpen[a] = true; srcClose[b] = true; }
    }
    if (!kinds.length && !Object.keys(srcOpen).length) return { html: escHtml(arabic), kinds };
    // Words the khateeb says again inside a hadith ("لا يمتن أحدكم إلا وهو يحسن الظن، إلا وهو يحسن
    // بالله الظن", 9 Oct 2026) are underlined, so the repetition is not taken for the Prophet's ﷺ:
    // a run of two or more words said more often in the span than the hadith's text has it.
    const restated = new Set();
    const count = (arr, run) => { let c = 0; for (let i = 0; i + run.length <= arr.length; i++) if (run.every((x, k) => arr[i + k] === x)) c++; return c; };
    for (const sp of Object.keys(opens).map(Number)) {
      const ref = opens[sp];
      if (ref.kind !== 'hadith') continue;
      const ep = Number(Object.keys(closes).find(k => closes[k] === ref));
      const said = norms.slice(sp, ep + 1);
      for (let j = sp + 1; j <= ep; j++) {
        for (let L = Math.min(6, ep - j + 1); L >= 2; L--) {
          const run = norms.slice(j, j + L);
          let before = false;
          for (let i = sp; i + L <= j && !before; i++) before = run.every((x, k) => norms[i + k] === x);
          if (before && count(said, run) > count(ref.words, run)) { for (let k = j; k < j + L; k++) restated.add(k); j += L - 1; break; }
        }
      }
    }
    const word = (p, h) => (restated.has(p) ? `<span class="restated" title="Repeated by the khateeb">${h}</span>` : h);
    let html = '', wi = 0;
    for (const tok of toks) {
      if (!tok.trim()) { html += escHtml(tok); continue; }
      const p = wi++;
      if (srcOpen[p]) html += '<span class="src-cite">';
      if (srcClose[p]) {
        const m = tok.match(/^([\s\S]*?)([.,!?;:؟،؛…]*)$/);
        html += escHtml(m[1]) + '</span>' + escHtml(m[2]);
        continue;
      }
      if (opens[p]) html += opens[p].kind === 'hadith' ? '<span class="inline-hadith">«' : '<span class="inline-ayah">﴿';
      if (closes[p]) {
        // Keep the imam's sentence punctuation outside the closing bracket.
        const m = tok.match(/^([\s\S]*?)([.,!?;:؟،؛…]*)$/);
        html += word(p, escHtml(m[1])) + (closes[p].kind === 'hadith'
          ? '»</span>'
          : ' ۝' + arabicDigits(closes[p].endAyah) + '﴾</span>') + escHtml(m[2]);
      } else {
        html += word(p, escHtml(tok));
      }
    }
    return { html, kinds };
  }

  function renderTranslation(r) {
    if (r.reader_chunks && r.reader_chunks.length > 0) {
      return r.reader_chunks.map((c, ci) => {
        let arabicAttrs = '';
        for (const part of c.english.split(/\n\n+/)) {
          const qm = part.match(/^📖\s+.+?\s+—\s+https:\/\/quran\.com\/([\d]+)\/([\d]+)/);
          if (qm) {
            // A badge label of "Abasa 80:25-32" marks a recited passage, not one verse —
            // carry the end ayah through so the card renders the whole range.
            const range = part.match(/\d+:\d+\s*-\s*(\d+)\s+—/);
            arabicAttrs = `data-surah="${qm[1]}" data-ayah="${qm[2]}"` + (range ? ` data-ayah-end="${range[1]}"` : '');
            break;
          }
        }
        const startAttr = (c.start_time != null ? `data-start="${c.start_time}"` : '')
          + (c.tts_start != null ? ` data-tts="${c.tts_start}"` : '')
          + TR.map(L => (c[`tts_${L.code}_start`] != null ? ` data-tts-${L.code}="${c[`tts_${L.code}_start`]}"` : '')).join('');
        const marked = arabicAttrs
          ? { html: escHtml(c.arabic), kinds: [] }
          : renderChunkArabic(c.arabic, [...inlineAyahRefs(c.english), ...inlineHadithRefs(c.english)]);
        const divider = c.second_khutbah_start
          ? `<div class="khutbah-divider"><span>۞ الخطبة الثانية · Second Khutbah ۞</span></div>`
          : '';
        return `${divider}
        <div class="reader-chunk" data-i="${ci}" ${startAttr}>
          <div class="chunk-arabic" ${arabicAttrs}>${marked.html}</div>
          <div class="chunk-en">${renderEnglishParts(c.english, marked.kinds)}</div>
          ${TR.map(L => (c[L.field] ? `<div class="chunk-tr tr-${L.code}" lang="${L.code}" dir="${L.dir}">${renderEnglishParts(c[L.field], marked.kinds, L)}</div>` : '')).join('')}
        </div>`;
      }).join('');
    }
    return `<p style="font-size:14px;line-height:1.9;color:#c3bca8;">${escHtml(r.translation || 'No translation available.')}</p>`;
  }

  // ── Tafsir popup ──
  function openQuranPopup(i) {
    const q = quranRefs[i];
    if (!q) return;
    const surah = q.surah_name || q.surah || 'Quranic Reference';
    const ayah = q.ayah_number || q.ayah || '';
    const refLabel = ayah ? `${surah} ${q.surah_number || ''}:${ayah}` : surah;
    const link = q.quran_link || q.quran_com_link;
    document.getElementById('popupTitle').textContent = refLabel;
    document.getElementById('popupBody').innerHTML = `
      <div class="popup-arabic" id="popup-arabic-${i}">${escHtml(q.detected_text || q.arabic || '')}</div>
      <div class="popup-tafsir-title">Tafsir Ibn Kathir</div>
      <p class="popup-tafsir-text" style="font-style:italic;">
        Tafsir integration coming soon. Full commentary from Ibn Kathir and As-Sa'di will appear here.
      </p>
      ${link ? `<a class="popup-qurancom" href="${link}" target="_blank" rel="noopener">Read full tafsir on Quran.com ↗</a>` : ''}
    `;
    document.getElementById('popupOverlay').classList.add('show');
  }
  function closePopup() { document.getElementById('popupOverlay').classList.remove('show'); }
  document.getElementById('popupOverlay').addEventListener('click', e => {
    if (e.target === document.getElementById('popupOverlay')) closePopup();
  });

  // ── Feedback ──
  function openFeedback() {
    document.getElementById('fbStatus').textContent = '';
    document.getElementById('feedbackOverlay').classList.add('show');
    document.getElementById('fbMessage').focus();
  }
  function closeFeedback() { document.getElementById('feedbackOverlay').classList.remove('show'); }
  document.getElementById('feedbackOverlay').addEventListener('click', e => {
    if (e.target === document.getElementById('feedbackOverlay')) closeFeedback();
  });

  async function submitFeedback() {
    const message = document.getElementById('fbMessage').value.trim();
    const contact = document.getElementById('fbContact').value.trim();
    const status = document.getElementById('fbStatus');
    if (!message) { status.style.color = '#fca5a5'; status.textContent = 'Please enter a message.'; return; }
    const btn = document.getElementById('fbSend');
    btn.disabled = true;
    try {
      const folder = currentFolder || result?.title || '';
      const res = await fetch('/api/feedback', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message, contact, folder })
      });
      if (!res.ok) throw new Error();
      status.style.color = 'var(--green)';
      status.textContent = '✓ Thank you! Your feedback was received.';
      document.getElementById('fbMessage').value = '';
      document.getElementById('fbContact').value = '';
      setTimeout(closeFeedback, 1500);
    } catch {
      status.style.color = '#fca5a5';
      status.textContent = 'Could not send. Please try again.';
    } finally {
      btn.disabled = false;
    }
  }

  // Share sends one line and the link (Meer, 13 Oct 2026): WhatsApp's preview card shows the title, the summary and the
  // picture. The line is in English until the whole site is translated (docs/I18N_PLAN.md: then in the page's language).
  function shareKhutbah() {
    engage.copies++;
    const L = TR.find(L => L.code === pageLang);
    const text = 'Listen to the entire khutbah in your language:';
    const url = location.origin + location.pathname;
    if (navigator.share && matchMedia('(pointer: coarse)').matches) {
      navigator.share({ title: result?.title || 'Khutbah.dev', text, url }).catch(() => {});
      return;
    }
    const all = text + ' ' + url;
    const done = () => {
      const lbl = document.querySelector('#shareBtn .share-lbl'), before = lbl.innerHTML;
      lbl.textContent = (L && L.ui['Link copied']) || 'Link copied';
      setTimeout(() => { lbl.innerHTML = before; }, 2200);
    };
    // the clipboard needs https; an http page (a test on the local network) copies the old way
    if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(all).then(done, () => {});
    else { const t = document.createElement('textarea'); t.value = all; t.style.cssText = 'position:fixed;top:-100px'; document.body.append(t); t.select(); try { document.execCommand('copy'); done(); } catch {} t.remove(); }
  }

  // ── Engagement, for /admin/traffic: time the page is on screen, audio actually played,
  //    the furthest point reached. Sent every 30 s while reading or listening, and when the
  //    page is hidden or closed (sendBeacon survives the page closing). No personal data.
  //    Since 2 Oct 2026 also: seconds played per track (imam, en, ur), the minutes of each track
  //    heard (where listeners stop), how far down the text they got, shares and reference taps.
  let visitId = null;
  const engage = { open: 0, played: 0, maxPos: 0, voices: {}, heard: {}, durs: {}, depth: 0, copies: 0, refs: 0 };
  let visibleSince = document.visibilityState === 'visible' ? Date.now() : null;
  const openSecs = () => engage.open + (visibleSince ? (Date.now() - visibleSince) / 1000 : 0);
  function sendEngage(final = false) {
    if (!visitId || !navigator.sendBeacon) return;
    const body = JSON.stringify({
      id: visitId, open_s: openSecs(), played_s: engage.played, max_pos: engage.maxPos,
      dur: audio && Number.isFinite(audio.duration) ? audio.duration : null,
      lang: pageLang, final,
      voices: engage.voices, durs: engage.durs, depth: engage.depth, copies: engage.copies, refs: engage.refs,
      heard: Object.fromEntries(Object.entries(engage.heard).map(([v, m]) => [v, [...m]])),
    });
    try { navigator.sendBeacon('/api/engage', new Blob([body], { type: 'text/plain' })); } catch {}
  }
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') { visibleSince = Date.now(); return; }
    if (visibleSince) engage.open += (Date.now() - visibleSince) / 1000;
    visibleSince = null;
    sendEngage(true);
  });
  window.addEventListener('pagehide', () => sendEngage(true));
  setInterval(() => { if (visibleSince || (audio && !audio.paused)) sendEngage(); }, 30000);
  addEventListener('scroll', () => {
    const chunks = document.querySelectorAll('.reader-chunk');
    if (!chunks.length) return;
    const top = chunks[0].getBoundingClientRect().top, bottom = chunks[chunks.length - 1].getBoundingClientRect().bottom;
    engage.depth = Math.round(Math.max(engage.depth, Math.min(100, (100 * (innerHeight - top)) / Math.max(1, bottom - top))));
  }, { passive: true });
  document.addEventListener('click', e => { if (e.target.closest('a[href*="quran.com"], a[href*="sunnah.com"]')) engage.refs++; }, true);

  // ── Audio player ──
  let audio = null;
  const SPEEDS = [1, 1.5, 2];
  let speedIdx = 0;
  let activeChunk = null;
  let pageLang = 'en';
  // Which track plays: the imam's recording ('imam'), or a voice reading the translation
  // ('en', 'ur'; tts.js). Each block holds its start in every track (data-start, data-tts,
  // data-tts-ur), so highlighting and tapping a block follow whichever is playing.
  let voice = 'imam';
  const timeAttr = v => (v === 'imam' ? 'start' : v === 'en' ? 'tts' : `tts-${v}`);
  const timeKey = () => timeAttr(voice).replace(/-(\w)/g, (_, c) => c.toUpperCase());
  const timedChunks = () => document.querySelectorAll(`.reader-chunk[data-${timeAttr(voice)}]`);
  // A block's start in the playing track; a block the voice skips starts at the next one.
  function chunkTime(el) {
    for (let e = el; e; e = e.nextElementSibling) {
      if (e.classList.contains('reader-chunk') && e.dataset[timeKey()] != null) return parseFloat(e.dataset[timeKey()]);
    }
    return null;
  }

  function switchTrack(to) {
    const wasPlaying = !audio.paused;
    const at = activeChunk;
    voice = to;
    loadWordTimes(to);
    audio.pause();
    audio.src = to === 'imam' ? result.audio_url : result['tts_' + to].url;
    audio.addEventListener('loadedmetadata', () => {
      audio.currentTime = (at && chunkTime(at)) || 0;
      audio.playbackRate = SPEEDS[speedIdx];
      if (wasPlaying) audio.play();
    }, { once: true });
    setPlayIcon(!wasPlaying);
    updateVoiceBtn();
  }

  // Phones: the player shrinks to one slim row while reading. Every visit opens it again
  // (Meer, 2 Oct): a shrunk player is easy to miss.
  function togglePlayerSize() {}

  // Hear is the audio only; the text stays as Read has it.
  function pickVoice(which) {
    if (!audio || which === voice) return;
    if (which === 'imam' || result['tts_' + which]) switchTrack(which);
  }

  // The Hear switch shows the imam and each language that has a voice, the playing one lit;
  // with no voice at all it hides.
  function updateVoiceBtn() {
    const group = document.getElementById('hearGroup');
    if (!group || !audio) return;
    const own = !document.body.classList.contains('ar-only') && result['tts_' + pageLang] ? pageLang : null;
    for (const b of document.querySelectorAll('#voiceSwitch button')) {
      const v = b.dataset.voice, on = v === voice;
      b.hidden = !(v === 'imam' || v === own);
      b.classList.toggle('on', on);
      b.setAttribute('aria-pressed', on);
    }
    group.hidden = !own;
    const L = TR.find(x => x.code === voice), val = document.getElementById('voiceVal');
    if (val) { val.textContent = voice === 'imam' ? 'Imam' : voice === 'en' ? 'English' : (L ? L.native : voice); val.lang = L ? L.code : ''; }
  }
  function toggleVoice() {
    const own = !document.body.classList.contains('ar-only') && result['tts_' + pageLang] ? pageLang : null;
    if (own) pickVoice(voice === 'imam' ? own : 'imam');
  }

  // ── Word by word ──
  // The text that goes with the audio follows it word by word: the Arabic while the imam
  // plays, and a translation while the voice reading it plays and the page shows it. A tap on
  // a word plays from it. The times come from align_words.py / align_imam.js (Meta's MMS
  // aligner, run offline), fetched once per track, and are matched to the words on screen,
  // which differ a little from what was said: "Allah says:" lead-ins, ﷺ read out in full,
  // verse numbers, and for the imam the Quran's own spelling of a verse he recited.
  const wordTimes = {};        // 'imam' | 'en' | 'ur' | 'bn' … -> { <block>: [[word, start, end], ...] }, once loaded
  const wordMaps = new Map();  // `${voice}:${block}:${full verse?}` -> [{ range, start }] in reading order
  let litKey = null, followEl = null, wordRaf = 0;
  let onWord = null, litRange = null;
  const HADITH = '.inline-hadith, .inline-hadith-en, .chunk-hadith-trans, .hadith-arabic';
  const QURAN = '.inline-ayah, .inline-ayah-en, .chunk-arabic-quran, .chunk-quran-translation';
  const kindOf = range => { const n = range.startContainer, el = n.nodeType === 1 ? n : n.parentElement; return el.closest(HADITH) ? 'h' : el.closest(QURAN) ? 'q' : ''; };
  function setHL(name, ranges) {
    const by = { '': [], q: [], h: [] };
    for (const x of ranges || []) by[kindOf(x)].push(x);
    for (const [k, list] of Object.entries(by)) { const nm = k ? name + '-' + k : name; if (list.length) CSS.highlights.set(nm, new Highlight(...list)); else CSS.highlights.delete(nm); }
  }
  function delHL(name) { for (const nm of [name, name + '-q', name + '-h']) CSS.highlights.delete(nm); }
  // A passage's translation lives in the lower pane (.tr-chunk), its Arabic in the upper one (.reader-chunk).
  const twinOf = el => (el && document.querySelector(`#paneTr .tr-chunk[data-i="${el.dataset.i}"]`)) || el;
  // Scrolling either pane scrolls the other to the same passage and the same point in it, on a reading line a third
  // of the way down. driveBy(pane) marks a pane the page itself is moving, so the other follows it and not back.
  let driveBy = () => {};
  // The hand (Meer, 13 Oct 2026), as on the home page: most visitors open a khutbah from a shared link, never the home
  // page, so the reader shows them the language line too. Once the line is on screen a hand taps English, then each
  // translation, three times round, with no words ("the finger doing it three times is enough"). Only for a visitor
  // who has not picked a language ('kt-lang'), on their first three khutbahs at most ('kt-hand'); it stops when they
  // pick one, press play or start reading. With reduced motion it rests under English.
  let stopHand = () => {};
  function setupHand() {
    const finger = document.getElementById('finger'), line = document.getElementById('tongues');
    if (!finger || !line) return;
    let shown = 0;
    try { if (localStorage.getItem('kt-lang')) return; shown = +localStorage.getItem('kt-hand') || 0; } catch {}
    const order = ['en', ...TR.map(L => L.code)].filter(l => line.querySelector(`button[data-l="${l}"]`));
    if (shown >= 3 || order.length < 2) return;
    const box = finger.parentElement, ring = finger.querySelector('.ring'), still = matchMedia('(prefers-reduced-motion: reduce)').matches;
    // where the fingertip touches the bottom of a language
    const spot = l => {
      const r = line.querySelector(`button[data-l="${l}"]`).getBoundingClientRect(), w = box.getBoundingClientRect(), s = finger.offsetWidth;
      return { x: r.left - w.left + r.width / 2 - s * .44, y: r.bottom - w.top - s * .02 };
    };
    const at = (p, s = 1) => `translate(${p.x}px, ${p.y}px) scale(${s})`;
    const tapOnly = l => line.querySelectorAll('button').forEach(b => b.classList.toggle('tap', b.dataset.l === l));
    let on = true, timer = 0, seen = null;
    const wait = ms => new Promise(res => { timer = setTimeout(res, ms); });
    const move = (from, to, ms, extra = {}) => finger.animate([{ transform: at(from), ...extra.from }, { transform: at(to), ...extra.to }], { duration: ms, easing: 'cubic-bezier(.65, 0, .35, 1)', fill: 'forwards' }).finished.catch(() => {});
    stopHand = () => {
      if (!on) return;
      on = false; clearTimeout(timer); seen?.disconnect();
      finger.getAnimations().forEach(a => { a.commitStyles?.(); a.cancel(); });
      finger.animate([{ opacity: getComputedStyle(finger).opacity }, { opacity: 0 }], { duration: 250, fill: 'forwards' });
      tapOnly(null);
    };
    const run = async () => {
      try { localStorage.setItem('kt-hand', String(shown + 1)); } catch {}
      if (still) { finger.style.transform = at(spot('en')); finger.style.opacity = 1; return; }
      for (let round = 0; round < 3 && on; round++) {
        let p = spot(order[0]);
        await move({ x: p.x, y: p.y + 30 }, p, 500, { from: { opacity: 0 }, to: { opacity: 1 } });
        for (const [i, l] of order.entries()) {
          if (!on) return;
          if (i) { const q = spot(l); await move(p, q, 650); p = q; }
          if (!on) return;
          tapOnly(l);
          finger.animate([{ transform: at(p) }, { transform: at(p, .86) }, { transform: at(p) }], { duration: 380, delay: 60, easing: 'ease-in-out', fill: 'forwards' });
          ring.animate([{ opacity: .9, transform: 'scale(.4)' }, { opacity: 0, transform: 'scale(1.6)' }], { duration: 650, delay: 160, easing: 'cubic-bezier(.33, 1, .68, 1)' });
          await wait(1500);
        }
        if (!on) return;
        tapOnly(null);
        await move(p, p, 400, { from: { opacity: 1 }, to: { opacity: 0 } });
        if (round < 2) await wait(1600);
      }
      on = false;
    };
    // start once the fonts have set the line where it stays and it is on screen, clear of the bar and the player
    document.fonts.ready.then(() => {
      if (!on) return;
      const tall = el => Math.round(el?.getBoundingClientRect().height || 0);
      const margin = `-${tall(document.querySelector('header'))}px 0px -${tall(document.getElementById('audioPlayer'))}px 0px`;
      seen = new IntersectionObserver(es => { if (es.some(e => e.isIntersecting)) { seen.disconnect(); timer = setTimeout(() => on && run(), 1500); } }, { threshold: 1, rootMargin: margin });
      seen.observe(line);
    });
  }

  // Text size (Meer, 12 Oct): three steps for both panes, kept for the next visit (localStorage 'kt-size')
  function setupSize() {
    const box = document.getElementById('textSize');
    if (!box) return;
    const set = v => {
      document.documentElement.style.setProperty('--ts', v);
      box.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.ts === String(v))));
    };
    let saved = null;
    try { saved = localStorage.getItem('kt-size'); } catch {}
    if (saved && box.querySelector(`[data-ts="${saved}"]`)) set(saved);
    box.addEventListener('click', e => {
      const b = e.target.closest('button');
      if (!b) return;
      set(b.dataset.ts);
      try { localStorage.setItem('kt-size', b.dataset.ts); } catch {}
    });
  }
  // The panes on a computer: top and bottom (the default) or side by side, kept for the next visit (localStorage 'kt-layout').
  function setupLayout() {
    const box = document.getElementById('layoutSwitch');
    if (!box) return;
    const set = v => {
      document.body.classList.toggle('side', v === 'side');
      box.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.layout === v)));
    };
    let saved = null;
    try { saved = localStorage.getItem('kt-layout'); } catch {}
    set(saved === 'side' ? 'side' : 'stack');
    box.addEventListener('click', e => {
      const b = e.target.closest('button');
      if (!b) return;
      set(b.dataset.layout);
      try { localStorage.setItem('kt-layout', b.dataset.layout); } catch {}
      document.getElementById('paneAr')?.dispatchEvent(new Event('scroll'));
    });
  }
  function setupPanes() {
    const A = document.getElementById('paneAr'), B = document.getElementById('paneTr');
    if (!A || !B) return;
    let driver = null, at = 0;
    driveBy = p => { driver = p; at = performance.now(); };
    const items = p => [...p.querySelectorAll(':scope > [data-i]')];
    const sync = (src, dst) => {
      const a = items(src), b = items(dst);
      if (!a.length || !b.length || dst.offsetParent === null) return;
      const line = src.scrollTop + src.clientHeight * 0.34;
      let i = a.findIndex(el => el.offsetTop + el.offsetHeight > line);
      if (i < 0) i = a.length - 1;
      const el = a[i], tw = b[Math.min(i, b.length - 1)];
      const f = Math.min(1, Math.max(0, (line - el.offsetTop) / Math.max(1, el.offsetHeight)));
      dst.scrollTop = tw.offsetTop + f * tw.offsetHeight - dst.clientHeight * 0.34;
    };
    for (const [src, dst] of [[A, B], [B, A]]) src.addEventListener('scroll', () => {
      const now = performance.now();
      if (driver !== src && now - at < 160) return;   // being moved by the other pane
      driver = src; at = now;
      sync(src, dst);
      if (src.scrollTop > 30) stopHand();
      // reading has started in a pane while the opening is still on screen: the reader comes up to fill it
      if (src.scrollTop > 30 && driver === src && document.getElementById('stage').getBoundingClientRect().top > (document.querySelector('header')?.offsetHeight || 0) + 6) toStage();
    }, { passive: true });
  }   // the line follower (initAudio) and the word lit now

  async function loadWordTimes(v) {
    const url = v === 'imam' ? result && result.imam_words_url
      : result && result['tts_' + v] && result['tts_' + v].words_url;
    if (!url || v in wordTimes) return;
    wordTimes[v] = null;
    try {
      const d = await (await fetch(url)).json();
      wordTimes[v] = d.blocks;
      // A voice track with the imam's recitation in it: his words, on the track's timeline.
      if (d.arabic && Object.keys(d.arabic).length) wordTimes[v + ':ar'] = d.arabic;
    } catch { delete wordTimes[v]; }
    paintWord();
  }

  // Short-form honorifics (4 Oct 2026): صلى الله عليه وسلم shows as ﷺ, رضي الله عنه as ﵁ and so on,
  // in the imam's Arabic, the English and the Urdu. Display only: the voices say the words, and the
  // sign lights with the first of them (shownWords). Never in the Quran's own text or a published
  // translation of it: 9:100 says رضي الله عنهم and 10:18 سبحانه وتعالى.
  // The Arabic forms; each language adds its own (honorifics in core/langs/<code>.js).
  const HONORIFICS = [
    ['\uFDFA', 'صلى الله عليه وسلم|ﷺ'], ['\uFD4A', 'عليه الصلاة والسلام'],
    ['\uFD47', 'عليه السلام'], ['\uFD48', 'عليهم السلام'],
    ['\uFD44', 'رضي الله عنهما'], ['\uFD43', 'رضي الله عنهم'],
    ['\uFD42', 'رضي الله عنها'], ['\uFD41', 'رضي الله عنه'],
    ['\uFD4F', 'رحمهم الله'], ['\uFD40', 'رحمه الله'],
    ['\uFDFE', 'سبحانه وتعالى'], ['\uFDFF', 'عز وجل|عزوجل'],
    ['\uFDFB', 'جل جلاله'], ['\uFD4E', 'تبارك وتعالى'],
  ];
  let HON_SIGN, HON_RE;
  function honorificForms() {
    const forms = HONORIFICS.flatMap(([sign, f]) => f.split('|').map(x => [x, sign]));
    for (const L of TR) for (const [sign, f] of Object.entries(L.honorifics || {})) forms.push(...f.split('|').map(x => [x, sign]));
    HON_SIGN = new Map(forms);
    HON_RE = new RegExp(`(?<![\\p{L}\\p{M}])(${[...HON_SIGN.keys()].join('|')})(?![\\p{L}\\p{M}])`, 'gu');
  }
  const NOT_HONORIFIC = '.chunk-arabic[data-surah], .inline-ayah, .inline-ayah-en, .chunk-quran-translation, .ref-english, script, style';
  function shortenHonorifics(root) {
    if (!HON_RE) honorificForms();
    const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
    const nodes = [];
    for (let n; (n = walker.nextNode());) {
      HON_RE.lastIndex = 0;
      if (HON_RE.test(n.data) && !n.parentElement.closest(NOT_HONORIFIC)) nodes.push(n);
    }
    for (const n of nodes) {
      const frag = document.createDocumentFragment();
      let last = 0;
      for (const m of n.data.matchAll(HON_RE)) {
        frag.append(n.data.slice(last, m.index));
        const s = document.createElement('span');
        const full = m[1] === 'ﷺ' ? 'صلى الله عليه وسلم' : m[1];
        s.className = 'hon';
        s.textContent = HON_SIGN.get(m[1]);
        s.title = full;
        s.setAttribute('aria-label', full);
        s.dataset.said = m[1] === 'ﷺ' ? '' : m[1].split(' ')[0];
        frag.append(s);
        last = m.index + m[0].length;
      }
      frag.append(n.data.slice(last));
      n.replaceWith(frag);
    }
  }

  // A word as compared: no diacritics, tatweel or punctuation, lower case; for Arabic also one
  // form of alif, ya and ta marbuta, as the transcript and the Quran's text spell them differently.
  const wordKey = (w, lang) => {
    let k = w.normalize('NFC').replace(/[\u0610-\u061A\u064B-\u065F\u0670\u06D6-\u06ED\u0640]/g, '');
    if (lang === 'ar') k = k.replace(/[\u0671\u0623\u0625\u0622]/g, '\u0627').replace(/\u0649/g, '\u064A')
      .replace(/\u0629/g, '\u0647').replace(/\u0624/g, '\u0648').replace(/\u0626/g, '\u064A')
      // The Quran's own spelling often drops a long alif (مَلَـٰٓئِكَة for ملائكة) or writes hamza
      // apart: compare without either.
      .replace(/[\u0627\u0621]/g, '');
    return k.replace(/[^\p{L}\p{M}\p{N}]/gu, '').toLowerCase();
  };

  // The words block `el` shows in `lang`, as ranges in reading order: the Arabic, or for a
  // translation the verse (only the version on screen, recited part or whole verse), then the prose.
  function shownWords(el, lang) {
    const out = [];
    const parts = el.querySelectorAll(lang === 'ar' ? '.chunk-arabic' : lang === 'en'
      ? '.chunk-quran-translation:not(.chunk-tr), .chunk-en .chunk-english, .chunk-en .chunk-hadith-trans'
      : `.chunk-quran-translation.tr-${lang}, .tr-${lang} .chunk-english, .tr-${lang} .chunk-hadith-trans`);
    for (const part of parts) {
      const walker = document.createTreeWalker(part, NodeFilter.SHOW_TEXT);
      for (let n; (n = walker.nextNode());) {
        const p = n.parentElement;
        if (p.closest('.tr-source, .ref-en-source, .trans-ours') || !p.getClientRects().length) continue;
        for (const m of n.data.matchAll(/\S+/g)) {
          // An honorific sign stands for its words: it lights with the first one said.
          const key = p.classList.contains('hon') ? wordKey(p.dataset.said, lang) : wordKey(m[0], lang);
          if (!key) continue;
          const range = document.createRange();
          range.setStart(n, m.index);
          range.setEnd(n, m.index + m[0].length);
          out.push({ key, range });
        }
      }
    }
    return out;
  }

  // Pairs the words on screen with the words spoken (longest common sequence), so each shown
  // word takes the start of the spoken word it matches; the rest are never lit on their own.
  function matchWords(shown, spoken, lang) {
    const a = shown.map(w => w.key), b = spoken.map(w => wordKey(w[0], lang));
    const n = a.length, m = b.length;
    const dp = Array.from({ length: n + 1 }, () => new Uint16Array(m + 1));
    for (let i = n - 1; i >= 0; i--) {
      for (let j = m - 1; j >= 0; j--) dp[i][j] = a[i] === b[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
    }
    const out = [];
    for (let i = 0, j = 0; i < n && j < m;) {
      if (a[i] === b[j]) { out.push({ range: shown[i].range, start: spoken[j][1] }); i++; j++; }
      else if (dp[i + 1][j] >= dp[i][j + 1]) i++;
      else j++;
    }
    return out;
  }

  // What follows the audio in block `el`: lists of its shown words with their times, each for
  // a stretch of time. The Arabic while the imam plays, and while a voice track plays his
  // recitation of a verse (a verse block, or one quoted in the middle of the prose); the
  // translation the rest of the time, while its voice plays and the page shows it.
  function followsOf(el) {
    const out = [];
    if (!el || !wordTimes[voice]) return out;
    const i = el.dataset.i, full = el.classList.contains('show-full-verse');
    const add = (lang, spoken, tag, from, until) => {
      if (!spoken || !spoken.length) return;
      const key = `${tag}:${i}:${full}`;
      if (!wordMaps.has(key)) wordMaps.set(key, matchWords(shownWords(lang === 'ar' ? el : twinOf(el), lang), spoken, lang));
      if (wordMaps.get(key).length) out.push({ lang, words: wordMaps.get(key), from, until });
    };
    if (voice === 'imam') add('ar', wordTimes.imam[i], 'imam', -Infinity, Infinity);
    else {
      const recited = wordTimes[voice + ':ar'] && wordTimes[voice + ':ar'][i];
      if (recited) add('ar', recited, voice + ':ar', recited[0][1] - 0.3, recited.at(-1)[2] + 0.3);
      if (voice === pageLang) add(voice, wordTimes[voice][i], voice, -Infinity, Infinity);
    }
    return out;
  }

  // In the block being heard: the words said so far bright (kt-said), the one being said gold
  // (kt-word), the rest dim (data-follow on the block; see the ::highlight styles).
  function paintWord() {
    if (!audio || !window.CSS || !CSS.highlights) return;
    const t = audio.currentTime + 0.03;
    const f = followsOf(activeChunk).find(f => t >= f.from && t < f.until);
    const el = f ? activeChunk : null;
    const words = f ? f.words : [];
    let k = -1;
    let lo = 0, hi = words.length - 1;
    while (lo <= hi) { const mid = (lo + hi) >> 1; if (words[mid].start <= t) { k = mid; lo = mid + 1; } else hi = mid - 1; }
    const key = el ? `${voice}:${el.dataset.i}:${f.lang}:${k}:${pageLang}` : null;
    if (key === litKey) return;
    litKey = key;
    const host = el && (f.lang === 'ar' ? el : twinOf(el));
    if (followEl && followEl !== host) delete followEl.dataset.follow;
    followEl = host;
    if (!el) { delHL('kt-said'); CSS.highlights.delete('kt-word'); clearNear(); return; }
    host.dataset.follow = f.lang;
    setHL('kt-said', words.slice(0, k + 1).map(w => w.range));
    if (k < 0) { CSS.highlights.delete('kt-word'); clearNear(); return; }
    const now = new Highlight(words[k].range);
    now.priority = 1; // painted over kt-said
    CSS.highlights.set('kt-word', now);
    litRange = words[k].range;
    onWord?.(litRange);
    nearArabic(el, f.lang, k, words.length);
  }

  // The part of the imam's sentence the voice is translating, matched by meaning (Meer, 12 Oct): each passage's
  // Arabic and translation split into matching phrases when the khutbah is made (design/reader/align/), and the
  // Arabic phrase whose translation the voice is reading is bright, the rest of his passage dimmed. A passage with
  // no matching (or one that does not check out) lights no part: nothing is guessed.
  // The translation does the same (Meer, 12 Oct): the phrase being read bright, the rest of its passage dimmed,
  // the word being said still gold.
  let nearEl = null, nearKey = null, nearTr = null;
  const alignCache = new Map();
  function clearNear() { if (nearEl) delete nearEl.dataset.near; nearEl = null; nearKey = null; nearTr = null; delHL('kt-near'); }
  const rawWords = t => t.split(/\s+/).filter(Boolean);
  const rawTr = t => (t || '').split(/\n\n+/).map(p => p.trim()).filter(p => p && !/^(📖|📑|📚)/u.test(p)).map(p => p.replace(/^❝\s*/, '')).join(' ');
  function alignOf(el, lang) {
    const i = el.dataset.i, key = lang + ':' + i;
    if (alignCache.has(key)) return alignCache.get(key);
    let out = null;
    const pairs = (result.align || {})[lang]?.[i];
    const c = result.reader_chunks?.[i];
    if (pairs && c) {
      const L = TR.find(x => x.code === lang);
      const ar = rawWords(c.arabic), tr = rawWords(rawTr(lang === 'en' ? c.english : c[L?.field]));
      let pa = -1, pt = -1, good = true;
      for (const [a, t] of pairs) { if (!(a > pa && t > pt)) good = false; pa = a; pt = t; }
      if (good && pa === ar.length - 1 && pt === tr.length - 1) {
        // the words on screen, each with its place in the passage's text
        const arShown = matchWords(shownWords(el, 'ar'), ar.map((w, j) => [w, j, j]), 'ar');
        const trShown = matchWords(shownWords(twinOf(el), lang), tr.map((w, j) => [w, j, j]), lang);
        out = { pairs, arShown, trShown };
      }
    }
    alignCache.set(key, out);
    return out;
  }
  function nearArabic(el, lang, k, n) {
    if (lang === 'ar' || !el || !litRange) return clearNear();
    const A = alignOf(el, lang);
    if (!A) return clearNear();
    const at = A.trShown.find(w => w.range.startContainer === litRange.startContainer && w.range.startOffset === litRange.startOffset);
    if (!at) { if (nearTr) setHL('kt-said', nearTr); return; }   // a lead-in the voice adds: keep the phrase lit
    const j = at.start;
    let s0 = 0, a0 = 0, a1 = -1, prevT = -1, t0 = 0, t1 = -1;
    for (const [a, t] of A.pairs) { if (j <= t && j > prevT) { a0 = s0; a1 = a; t0 = prevT + 1; t1 = t; break; } prevT = t; s0 = a + 1; }
    if (a1 < 0) return clearNear();
    const k2 = el.dataset.i + ':' + a0 + ':' + a1;
    if (k2 !== nearKey) {
      const trLit = A.trShown.filter(w => w.start >= t0 && w.start <= t1).map(w => w.range);
      nearTr = trLit.length ? trLit : null;
    }
    // the translation phrase bright in place of the words said so far (paintWord sets those on every word)
    if (nearTr) setHL('kt-said', nearTr);
    if (k2 === nearKey) return;
    const lit = A.arShown.filter(w => w.start >= a0 && w.start <= a1).map(w => w.range);
    if (!lit.length) return clearNear();
    if (nearEl && nearEl !== el) delete nearEl.dataset.near;
    nearEl = el; nearKey = k2; el.dataset.near = '';
    setHL('kt-near', lit);
  }

  // Every frame while playing: timeupdate comes only about four times a second.
  function wordTick() {
    wordRaf = 0;
    if (!audio || audio.paused) return;
    paintWord();
    wordRaf = requestAnimationFrame(wordTick);
  }

  // The start of the word under a tap in block `el`, if words are followed there.
  function wordTimeAt(el, x, y) {
    const words = followsOf(el).flatMap(f => f.words);
    if (!words.length) return null;
    let node, offset;
    if (document.caretPositionFromPoint) {
      const p = document.caretPositionFromPoint(x, y);
      if (p) ({ offsetNode: node, offset } = p);
    } else if (document.caretRangeFromPoint) {
      const r = document.caretRangeFromPoint(x, y);
      if (r) ({ startContainer: node, startOffset: offset } = r);
    }
    if (!node) return null;
    const w = words.find(w => w.range.startContainer === node && offset >= w.range.startOffset && offset <= w.range.endOffset);
    return w ? w.start : null;
  }

  function skip(sec) {
    if (!audio) return;
    const max = audio.duration || (audio.currentTime + sec);
    audio.currentTime = Math.min(Math.max(0, audio.currentTime + sec), max);
  }

  function cycleSpeed() {
    if (!audio) return;
    speedIdx = (speedIdx + 1) % SPEEDS.length;
    audio.playbackRate = SPEEDS[speedIdx];
    document.getElementById('speedVal').textContent = SPEEDS[speedIdx] + '×';
  }

  function initAudio(url) {
    // Hear starts in the language Read opened in, where the khutbah has its voice; each switch then
    // changes only its own side (listen in Urdu, read in English).
    if (result['tts_' + pageLang]) voice = pageLang;
    audio = new Audio(voice === 'imam' ? url : result['tts_' + voice].url);
    audio.playbackRate = SPEEDS[speedIdx];
    const player = document.getElementById('audioPlayer');
    const scrubber = document.getElementById('scrubber');
    const timeEl = document.getElementById('audioTime');
    player.classList.add('ready');
    updateVoiceBtn();
    audio.addEventListener('play', () => { document.body.classList.add('playing', 'reading'); if (following) toActive(); });
    audio.addEventListener('pause', () => document.body.classList.remove('playing'));
    audio.addEventListener('ended', () => document.body.classList.remove('playing'));

    // The time shows as "0:28 / 15:59" in the row, and as two ends under the phone's bar.
    const showTime = () => {
      if (!audio.duration) return;
      timeEl.textContent = `${fmt(audio.currentTime)} / ${fmt(audio.duration)}`;
      document.getElementById('apCur').textContent = fmt(audio.currentTime);
      document.getElementById('apDur').textContent = fmt(audio.duration);
    };
    audio.addEventListener('loadedmetadata', showTime);

    // The page keeps the block being read in view. Scrolling away by hand stops that and shows an
    // arrow back to it; the arrow, scrolling back to it, or tapping a block follows again.
    let following = true, byHand = false;
    const backBtn = document.getElementById('backToActive');
    const follow = () => { following = true; backBtn.hidden = true; };
    const still = () => matchMedia('(prefers-reduced-motion: reduce)').matches;
    const paneAr = document.getElementById('paneAr');
    const paneOf = node => (node.nodeType === 1 ? node : node.parentElement).closest('.pane') || paneAr;
    let glidedAt = 0;   // one glide at a time: while a pane moves, the line is not yet where it will be
    const toLine = range => {
      const r = range.getBoundingClientRect();
      if (!r.height) return false;
      const pane = paneOf(range.startContainer), p = pane.getBoundingClientRect();
      glidedAt = performance.now(); driveBy(pane);
      pane.scrollTo({ top: pane.scrollTop + (r.top - p.top) - pane.clientHeight * 0.34, behavior: still() ? 'auto' : 'smooth' });
      return true;
    };
    onWord = range => {
      if (!following || audio.paused || performance.now() - glidedAt < 900) return;
      const r = range.getBoundingClientRect();
      if (!r.height) return;
      const pane = paneOf(range.startContainer), p = pane.getBoundingClientRect(), h = pane.clientHeight;
      if (r.top - p.top < h * 0.16 || r.bottom - p.top > h * 0.6) toLine(range);
    };
    const toActive = () => {
      follow(); byHand = false;
      toStage();
      if (!activeChunk) return;
      if (litRange && [activeChunk, twinOf(activeChunk)].some(x => x.contains(litRange.startContainer)) && toLine(litRange)) return;
      const p = paneAr.getBoundingClientRect(), r = activeChunk.getBoundingClientRect();
      driveBy(paneAr);
      paneAr.scrollTo({ top: paneAr.scrollTop + (r.top - p.top) - paneAr.clientHeight * 0.12, behavior: still() ? 'auto' : 'smooth' });
    };
    const showBack = () => {
      const r = activeChunk?.getBoundingClientRect();
      const pr = document.getElementById('paneAr').getBoundingClientRect();
      // scrolled on past the khutbah, or the passage out of its pane
      const below = document.getElementById('stage').getBoundingClientRect().bottom < innerHeight * 0.55;
      const away = !!r && (below || r.bottom < pr.top + 8 || r.top > pr.bottom - 8);
      if (byHand) following = !away;
      backBtn.hidden = following;
      if (away) backBtn.classList.toggle('up', below || r.bottom < pr.top + 8);
    };
    ['wheel', 'touchmove', 'keydown'].forEach(t => addEventListener(t, () => { byHand = true; }, { passive: true }));
    document.querySelectorAll('.pane').forEach(p => p.addEventListener('scroll', () => { if (byHand) showBack(); }, { passive: true }));
    addEventListener('scroll', () => { if (byHand) showBack(); }, { passive: true });
    backBtn.addEventListener('click', toActive);

    let lastT = null;
    audio.addEventListener('timeupdate', () => {
      // Count audio actually played: small forward steps while playing, not seeks.
      const step = audio.currentTime - (lastT ?? audio.currentTime);
      if (!audio.paused && step > 0 && step < 3) {
        engage.played += step;
        engage.voices[voice] = (engage.voices[voice] || 0) + step;
        (engage.heard[voice] ||= new Set()).add(Math.floor(audio.currentTime / 60));
        if (Number.isFinite(audio.duration)) engage.durs[voice] = Math.round(audio.duration);
      }
      lastT = audio.currentTime;
      engage.maxPos = Math.max(engage.maxPos, audio.currentTime);
      if (!audio.duration) return;
      scrubber.value = (audio.currentTime / audio.duration) * 100;
      scrubber.style.setProperty('--p', scrubber.value + '%');
      showTime();

      const t = audio.currentTime;
      const chunks = timedChunks();
      if (!chunks.length) return;
      paintWord();
      let best = chunks[0];
      for (const el of chunks) {
        if (parseFloat(el.dataset[timeKey()]) <= t) best = el;
        else break;
      }
      if (best !== activeChunk) {
        if (activeChunk) { activeChunk.classList.remove('chunk-active'); twinOf(activeChunk).classList.remove('chunk-active'); }
        best.classList.add('chunk-active'); twinOf(best).classList.add('chunk-active');
        activeChunk = best;
        if (!audio.paused) { if (following) toActive(); else showBack(); }
      }
    });

    audio.addEventListener('ended', () => { setPlayIcon(true); sendEngage(true); });
    audio.addEventListener('pause', () => sendEngage(true));
    audio.addEventListener('seeking', () => { lastT = null; });
    audio.addEventListener('play', () => { loadWordTimes(voice); if (!wordRaf) wordRaf = requestAnimationFrame(wordTick); });
    audio.addEventListener('seeked', paintWord);

    document.querySelectorAll('.reader-chunk').forEach(el => {
      el.addEventListener('click', e => {
        if (e.target.closest('a')) return;
        follow();
        const w = wordTimeAt(el, e.clientX, e.clientY);
        if (w != null) { audio.currentTime = w; audio.play(); setPlayIcon(false); return; }
        const t = chunkTime(el);
        if (t == null) return;
        audio.currentTime = t;
        audio.play();
        setPlayIcon(false);
      });
    });

    document.querySelectorAll('#paneTr .tr-chunk').forEach(tw => tw.addEventListener('click', e => {
      if (e.target.closest('a, button')) return;
      const a = document.querySelector(`#paneAr .reader-chunk[data-i="${tw.dataset.i}"]`);
      if (!a) return;
      follow();
      const w = wordTimeAt(a, e.clientX, e.clientY), t = w ?? chunkTime(a);
      if (t == null) return;
      audio.currentTime = t; audio.play(); setPlayIcon(false);
    }));

    scrubber.addEventListener('input', () => {
      follow();
      audio.currentTime = (scrubber.value / 100) * audio.duration;
    });
  }

  function setPlayIcon(paused) {
    document.getElementById('playIcon').style.display  = paused ? '' : 'none';
    document.getElementById('pauseIcon').style.display = paused ? 'none' : '';
  }

  function togglePlay() {
    stopHand();
    if (!audio) return;
    if (audio.paused) { audio.play(); setPlayIcon(false); }
    else { audio.pause(); setPlayIcon(true); }
  }

  function fmt(s) {
    const m = Math.floor(s / 60);
    const sec = Math.floor(s % 60).toString().padStart(2, '0');
    return `${m}:${sec}`;
  }

  function escHtml(str) {
    return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function escAttr(str) { return escHtml(str).replace(/'/g, '&#39;'); }
</script>

</body>
</html>
