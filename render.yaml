# Render Blueprint for the public read-only KhutbahTranscribe listening site.
# Render natively supports persistent Express + WebSocket servers (unlike Vercel's
# serverless model), which this app needs: it holds open WS connections for the
# live viewer count and streams audio + result.json straight from disk.
#
# Deploy: push this repo to GitHub, then in the Render dashboard
#   New +  →  Blueprint  →  pick this repo. It reads this file automatically.
services:
  - type: web
    name: khutbah-live
    runtime: node
    plan: starter
    region: oregon
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /api/results
    envVars:
      - key: NODE_VERSION
        value: "20"
      # Secret for reading submitted feedback at /admin/feedback?key=<value>.
      # sync:false → Render prompts you to set it in the dashboard (not stored in git).
      - key: ADMIN_TOKEN
        sync: false
    disk:
      name: khutbah-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
