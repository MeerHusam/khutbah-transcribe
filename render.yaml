# Render Blueprint for the public read-only KhutbahTranscribe listening site.
# Render natively supports persistent Express + WebSocket servers (unlike Vercel's
# serverless model), which this app needs: it holds open WS connections for the
# live viewer count and streams audio + result.json straight from disk.
#
# Deploy: push this repo to GitHub, then in the Render dashboard
#   New +  →  Blueprint  →  pick this repo. It reads this file automatically.
#
# NOTE: `name` must match the service name in the Render dashboard. Render matches
# Blueprint services by name, so a mismatch makes it create a SECOND service with a
# fresh empty disk instead of updating this one.
services:
  - type: web
    name: khutbahtranscribe
    runtime: node
    plan: starter
    region: oregon
    buildCommand: npm install
    startCommand: node server/server.js
    healthCheckPath: /api/results
    # Deploy only when what the site runs changes. A deploy takes the site down for ~75 s (a
    # service with a disk cannot run two copies at once), and most commits are the Mac's pipeline,
    # docs, tests or a publish's list (server/khutbahs.seed.json, read only by a fresh database).
    # The server imports core/reader_chunks.js alone from core/: list any other file it comes to need.
    buildFilter:
      paths:
        - server/**/*.js
        - server/admin/**
        - public/**
        - core/reader_chunks.js
        - core/quran_en.js
        - core/quran_en_hilali_khan.json
        - core/languages.js
        - core/langs/**
        - package.json
        - package-lock.json
        - render.yaml
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Secret for reading submitted feedback at /admin/feedback?key=<value>.
      # sync:false → Render prompts you to set it in the dashboard (not stored in git).
      - key: ADMIN_TOKEN
        sync: false
    disk:
      name: khutbah-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
