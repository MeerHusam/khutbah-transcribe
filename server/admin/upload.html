<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Send a Khutbah</title>
<style>
  :root { --bg: #0c1811; --card: #13241a; --line: #284434; --fg: #ece5d6; --mut: #a39a88; --gold: #e0c27a; --green: #2fa36b; --red: #e07a6a; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.5 system-ui, -apple-system, sans-serif; padding: 20px 16px 60px; max-width: 560px; margin-inline: auto; }
  h1 { font-size: 22px; margin: 4px 0 4px; color: var(--gold); font-weight: 600; }
  .sub { color: var(--mut); font-size: 14px; margin: 0 0 20px; }
  .hint { color: var(--mut); font-size: 12.5px; margin: 8px 0 0; line-height: 1.5; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; margin-bottom: 16px; }
  label { display: block; font-size: 13px; color: var(--mut); margin: 12px 0 6px; }
  input[type=text], input[type=date] { color-scheme: dark; width: 100%; padding: 12px; border-radius: 10px; border: 1px solid var(--line); background: #0f1d15; color: var(--fg); font-size: 16px; }
  .file { display: flex; align-items: center; justify-content: center; text-align: center; border: 2px dashed var(--line); border-radius: 12px; padding: 22px 12px; color: var(--mut); cursor: pointer; }
  .file.has { border-color: var(--green); color: var(--fg); }
  .file input { display: none; }
  .check { display: flex; gap: 10px; align-items: center; margin-top: 14px; font-size: 14px; color: var(--mut); }
  .check input { width: 20px; height: 20px; }
  button { width: 100%; margin-top: 18px; padding: 14px; border: 0; border-radius: 12px; background: var(--green); color: #fff; font-size: 17px; font-weight: 600; }
  button:disabled { opacity: .5; }
  .bar { height: 8px; background: #0f1d15; border-radius: 4px; overflow: hidden; margin-top: 14px; display: none; }
  .bar div { height: 100%; width: 0; background: var(--gold); transition: width .2s; }
  .msg { margin-top: 10px; font-size: 14px; min-height: 20px; }
  .err { color: var(--red); }
  .job h2 { font-size: 16px; margin: 0 0 2px; }
  .job .meta { color: var(--mut); font-size: 13px; margin-bottom: 10px; }
  .steps { list-style: none; margin: 0; padding: 0; }
  .steps li { display: flex; gap: 10px; padding: 5px 0; font-size: 15px; color: var(--mut); }
  .steps li.done { color: var(--fg); }
  .steps li.now { color: var(--gold); }
  .steps li.bad { color: var(--red); }
  .steps .dot { width: 18px; flex: none; text-align: center; }
  .steps .when { margin-left: auto; font-size: 12px; color: var(--mut); }
  .note { font-size: 13px; color: var(--mut); margin-top: 6px; }
  .live { display: flex; gap: 10px; margin-top: 12px; }
  .live a, .live button { flex: 1; margin: 0; text-align: center; padding: 12px; border-radius: 10px; font-size: 15px; text-decoration: none; }
  .live a { background: var(--gold); color: #1a1a12; font-weight: 600; }
  .live button { background: #23402f; color: var(--fg); }
</style>
</head>
<body>
<h1>Send a khutbah</h1>
<p class="sub">Upload the recording right after the khutbah. Your Mac picks it up and the page goes live with English, Urdu, Bengali and the voices, usually in about 20 minutes.</p>

<div class="card">
  <label class="file" id="drop"><input type="file" id="file" accept="audio/*,video/*,.m4a,.mp3,.wav,.aac,.caf,.opus"><span id="fileLabel">Tap to choose the recording</span></label>
  <p class="hint">From Voice Memos on an iPhone: open the recording, tap ⋯ › Share › Save to Files, then tap above and pick Choose Files.</p>
  <label for="masjid">Masjid (leave empty for Askan AlMaather Mosque)</label>
  <input type="text" id="masjid" list="masjids" placeholder="Askan AlMaather Mosque" autocomplete="off">
  <datalist id="masjids"></datalist>
  <label for="speaker">Imam (optional, e.g. Sheikh Faisal Ghazzawi)</label>
  <input type="text" id="speaker" list="speakers" placeholder="Friday Khutbah" autocomplete="off">
  <datalist id="speakers"></datalist>
  <label for="date">Date of the khutbah (change it only for an older recording)</label>
  <input type="date" id="date">
  <label class="check"><input type="checkbox" id="single"> One khutbah only (Eid, Arafah, a lecture)</label>
  <button id="go" disabled>Upload</button>
  <div class="bar" id="bar"><div></div></div>
  <div class="msg" id="msg"></div>
</div>

<div id="jobs"></div>

<script>
  const key = new URLSearchParams(location.search).get('key') || '';
  const $ = id => document.getElementById(id);
  const STEPS = [
    ['uploaded', 'Uploaded'],
    ['claimed', 'Picked up by the Mac'],
    ['transcribing', 'Writing down the Arabic'],
    ['english', 'English translation and references'],
    ['translations', 'Translations (Urdu, Bengali) and review'],
    ['voices', 'Recording the voices'],
    ['timing', 'Word-by-word timing'],
    ['publishing', 'Publishing to the site'],
    ['live', 'Live'],
  ];
  const ORDER = STEPS.map(s => s[0]);
  // The date defaults to today; the masjid box starts empty (our masjid) and suggests the names
  // already on the site, which must match exactly for the home page's masjid buttons.
  $('date').value = new Date().toLocaleDateString('sv');
  fetch('/api/results').then(r => r.json()).then(d => {
    $('masjids').innerHTML = [...new Set(d.items.map(k => k.masjid).filter(Boolean))].map(m => `<option value="${esc(m)}">`).join('');
    $('speakers').innerHTML = [...new Set(d.items.map(k => k.speaker).filter(s => /^Sheikh /.test(s || '')))].map(s => `<option value="${esc(s)}">`).join('');
  }).catch(() => {});

  let file = null;
  $('file').addEventListener('change', e => {
    file = e.target.files[0] || null;
    $('fileLabel').textContent = file ? `${file.name} · ${(file.size / 1048576).toFixed(1)} MB` : 'Tap to choose the recording';
    $('drop').classList.toggle('has', !!file);
    $('go').disabled = !file;
  });

  $('go').addEventListener('click', () => {
    if (!file) return;
    const masjid = $('masjid').value.trim();
    const xhr = new XMLHttpRequest();
    xhr.open('POST', '/admin/upload');
    xhr.setRequestHeader('x-admin-key', key);
    xhr.setRequestHeader('x-file-name', encodeURIComponent(file.name));
    xhr.setRequestHeader('x-masjid', encodeURIComponent(masjid));
    xhr.setRequestHeader('x-speaker', encodeURIComponent($('speaker').value.trim()));
    xhr.setRequestHeader('x-single', $('single').checked ? '1' : '0');
    xhr.setRequestHeader('x-date', $('date').value);
    xhr.setRequestHeader('content-type', file.type || 'application/octet-stream');
    $('bar').style.display = 'block'; $('go').disabled = true; $('msg').className = 'msg'; $('msg').textContent = 'Uploading…';
    xhr.upload.onprogress = e => { if (e.lengthComputable) $('bar').firstElementChild.style.width = `${(e.loaded / e.total) * 100}%`; };
    xhr.onload = () => {
      let r = {}; try { r = JSON.parse(xhr.responseText); } catch {}
      if (xhr.status === 200) {
        $('msg').textContent = 'Uploaded. You can leave this page open to follow it.';
        file = null; $('file').value = ''; $('fileLabel').textContent = 'Tap to choose the recording'; $('drop').classList.remove('has');
        refresh();
      } else { $('msg').className = 'msg err'; $('msg').textContent = r.error || `Upload failed (${xhr.status})`; $('go').disabled = false; }
    };
    xhr.onerror = () => { $('msg').className = 'msg err'; $('msg').textContent = 'Upload failed: check the connection and try again.'; $('go').disabled = false; };
    xhr.send(file);
  });

  const time = iso => new Date(iso).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  function render(job) {
    const at = {}; for (const l of job.log) at[l.status === 'urdu' ? 'translations' : l.status] = l; // 'urdu' before 5 Oct 2026
    const failed = job.status === 'failed';
    const cur = ORDER.indexOf(job.status);
    const steps = STEPS.map(([s, label], k) => {
      const done = at[s] && (k < cur || job.status === 'live');
      const now = !failed && k === cur && job.status !== 'live';
      const cls = done ? 'done' : now ? 'now' : '';
      const extra = at[s]?.message ? ` · <span style="color:var(--mut)">${esc(at[s].message)}</span>` : '';
      return `<li class="${cls}"><span class="dot">${done ? '✓' : now ? '●' : '○'}</span><span>${label}${extra}</span>${at[s] ? `<span class="when">${time(at[s].at)}</span>` : ''}</li>`;
    }).join('');
    const failNote = failed ? `<li class="bad"><span class="dot">✗</span><span>Stopped: ${esc(at.failed?.message || 'see the Mac')}</span></li>` : '';
    const waiting = job.status === 'uploaded' && Date.now() - new Date(job.uploaded_at) > 120000
      ? '<p class="note">The Mac has not picked it up yet. Is it on and running the worker?</p>' : '';
    const live = job.status === 'live' && job.link
      ? `<div class="live"><a href="${esc(job.link)}" target="_blank">Open the page</a><button onclick="navigator.clipboard.writeText('${esc(job.link)}').then(()=>this.textContent='Copied')">Copy link</button></div>` : '';
    const mins = Math.round(((job.status === 'live' ? new Date(at.live.at) : Date.now()) - new Date(job.uploaded_at)) / 60000);
    return `<div class="card job"><h2>${esc(job.title || job.name)}</h2><div class="meta">${esc(job.masjid || 'Askan AlMaather Mosque')} · uploaded ${time(job.uploaded_at)} · ${mins} min${job.status === 'live' ? ' to go live' : ' so far'}</div><ul class="steps">${steps}${failNote}</ul>${waiting}${live}</div>`;
  }

  async function refresh() {
    try {
      const r = await fetch('/admin/uploads', { headers: { 'x-admin-key': key } });
      if (r.status === 401) { $('msg').className = 'msg err'; $('msg').textContent = 'This link is missing the right key.'; return; }
      const jobs = await r.json();
      $('jobs').innerHTML = jobs.slice(0, 5).map(render).join('');
    } catch {}
  }
  refresh();
  setInterval(refresh, 5000);
</script>
</body>
</html>
